<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<title>エアリス牧場 年史</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏇</text></svg>">
<style>
:root{
  --bg:#eef5f1; --panel:#fff; --panel2:#f4faf7; --line:#dae7e0;
  --ink:#16261e; --muted:#4a5b51;
  --accent:#0f7a4c; --accent-soft:#ddf3e8;
  --gold:#c08a08; --gold-ink:#8a6205; --gold-soft:#fff2ce;
  --jp:#d43f38; --us:#2166cf; --eu:#7a4bc6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --sea:#e2ecf2; --land:#f6f3ec; --landline:#cfc8b9;
  --g1:#2b6cd4; --g2:#b83226; --g3:#66b84f; --gx:#8a9490;
  --on-bright:#fff;
  --shadow:0 1px 2px rgba(16,60,40,.05),0 10px 28px rgba(16,60,40,.07);
}
:root[data-theme="dark"]{
  --bg:#111815; --panel:#1a221e; --panel2:#222c27; --line:#2f3b34;
  --ink:#eaf3ed; --muted:#9db1a5;
  --accent:#57d497; --accent-soft:#172b22;
  --gold:#e9c05a; --gold-ink:#f0cd75; --gold-soft:#33290f;
  --jp:#f9756c; --us:#6fa8f7; --eu:#b489f5;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --sea:#141d1a; --land:#252e29; --landline:#3c4841;
  --g1:#4d8fe3; --g2:#bf3d2e; --g3:#4aa350; --gx:#7c8a82;
  --on-bright:#101713;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,Meiryo,system-ui,sans-serif;
  line-height:1.7;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:360px;z-index:-1;
  background:linear-gradient(180deg,var(--accent-soft),transparent)}
a{color:inherit;text-decoration:none}
a.link{color:var(--accent);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px}
a.link:hover{opacity:.7}

header{position:sticky;top:0;z-index:20;background:var(--panel);box-shadow:0 1px 12px rgba(16,60,40,.06)}
header::after{content:"";display:block;height:3px;
  background:linear-gradient(90deg,var(--jp),var(--gold),var(--accent),var(--us),var(--eu))}
.hd{max-width:1400px;margin:0 auto;padding:11px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.04em;white-space:nowrap;color:var(--accent)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:5px 13px;border-radius:999px;font-size:14px;color:var(--muted);transition:.12s}
nav a:hover{background:var(--panel2);color:var(--ink)}
nav a.on{background:var(--accent);color:var(--on-bright);font-weight:600}
.search{margin-left:auto;position:relative}
.search input{width:190px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel2);color:var(--ink);font-size:14px;font-family:inherit}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sug{position:absolute;top:112%;right:0;width:260px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;box-shadow:var(--shadow);overflow:hidden;max-height:320px;overflow-y:auto}
.sug a{display:block;padding:8px 13px;font-size:14px;border-bottom:1px solid var(--line)}
.sug a:last-child{border-bottom:0}
.sug a:hover{background:var(--accent-soft)}
.sug small{color:var(--muted);margin-left:6px}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.theme-btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);
  width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:15px;line-height:1;padding:0}
.theme-btn:hover{border-color:var(--accent);color:var(--accent)}

main{max-width:1400px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:25px;margin:0 0 5px;letter-spacing:.03em}
.sub{color:var(--muted);font-size:13px;margin-bottom:24px}

/* ---- 年度表彰 ---- */
.yr{background:var(--panel);border-radius:16px;margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow)}
.yr>summary{padding:15px 20px;cursor:pointer;display:flex;align-items:baseline;gap:13px;
  font-size:21px;font-weight:700;list-style:none}
.yr>summary::-webkit-details-marker{display:none}
.yr>summary::before{content:"▸";color:var(--accent);font-size:13px;transition:transform .15s}
.yr[open]>summary::before{transform:rotate(90deg)}
.yr>summary:hover{background:var(--panel2)}
.yr>summary .meta{font-weight:400;font-size:12px;color:var(--muted);margin-left:auto}
.yr>summary .top{font-weight:600;font-size:14px;color:var(--gold-ink)}
.regions{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1px;
  background:var(--line);border-top:1px solid var(--line)}
.reg{background:var(--panel);padding:16px 18px 18px}
.reg h3{margin:0 0 13px;font-size:12px;letter-spacing:.09em;color:var(--on-bright);font-weight:700;
  display:inline-flex;align-items:center;gap:7px;padding:4px 13px;border-radius:999px}
.reg.日本 h3{background:var(--jp)} .reg.アメリカ h3{background:var(--us)} .reg.欧州 h3{background:var(--eu)}
.reg h3 span{opacity:.75;font-weight:400;letter-spacing:0}
.aw{display:grid;grid-template-columns:6.5em 1fr;gap:2px 10px;font-size:13.5px;padding:6px 0;
  border-bottom:1px dashed var(--line);margin:0}
.aw:last-of-type{border-bottom:0}
.aw.hero{background:linear-gradient(120deg,var(--gold-soft),transparent 72%);
  border:1px solid var(--gold);border-bottom:1px solid var(--gold);
  margin:0 -6px 9px;padding:10px;border-radius:12px}
.aw dt{color:var(--muted);font-size:11.5px;padding-top:3px}
.aw.hero dt{color:var(--gold-ink);font-weight:700}
.aw.hero dt::before{content:"🏆 "}
.aw dd{margin:0}
.aw .who{font-weight:600}
.aw.hero .who{font-size:17px}
.aw .rec{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.aw .g1{font-size:11.5px;color:var(--gold-ink);margin-top:1px}
.none{color:var(--muted);font-size:13px;opacity:.6}
.ext{font-size:10px;margin-left:6px;padding:1px 7px;border-radius:999px;
  background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-weight:400;vertical-align:middle}
.rivals{margin-top:12px;border-top:1px solid var(--line);padding-top:9px}
.rivals>summary{cursor:pointer;font-size:11.5px;color:var(--accent);list-style:none;font-weight:600}
.rivals>summary::-webkit-details-marker{display:none}
.rivals>summary::before{content:"▸ ";font-size:9px}
.rivals[open]>summary::before{content:"▾ "}
.rrow{font-size:12px;padding:6px 0;border-bottom:1px dashed var(--line)}
.rrow:last-child{border-bottom:0}
.rrow b{font-weight:600}
.rrow span{color:var(--muted);margin-left:8px;font-size:11px}
.rrow em{display:block;font-style:normal;color:var(--gold-ink);font-size:11px}

/* ---- カルテ ---- */
.card{background:var(--panel);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card h2{margin:0 0 15px;font-size:12px;letter-spacing:.11em;color:var(--accent);font-weight:700}
.hero-h{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:6px}
.hero-h .name{font-size:32px;font-weight:700;letter-spacing:.02em;line-height:1.2}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 11px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);font-weight:600}
.tag.b{background:linear-gradient(120deg,var(--gold),#e5b53c);color:var(--on-bright);
  box-shadow:0 2px 8px rgba(192,138,8,.3)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:13px;margin-top:16px}
.facts div{font-size:14px}
.facts span{display:block;font-size:11px;color:var(--muted);letter-spacing:.06em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px;text-align:center}
.stats div{padding:12px 4px;background:var(--accent-soft);border-radius:12px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.3;color:var(--accent)}
.stats span{font-size:11px;color:var(--muted)}

table{width:100%;border-collapse:collapse;font-size:13px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
th{text-align:left;font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.05em;
  padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover{background:var(--accent-soft)}
.num{text-align:right;font-variant-numeric:tabular-nums}
td.win{color:var(--gold-ink);font-weight:700}
.gr{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.gr.g1{background:linear-gradient(120deg,var(--gold),#e5b53c);color:var(--on-bright)}
.ysep td{background:var(--panel2);font-weight:700;font-size:12px;color:var(--accent);padding:5px 8px}

.ped{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;font-size:12.5px}
.pcol{display:grid;gap:4px;grid-auto-rows:1fr}
.pcol>div{background:var(--panel2);border-radius:8px;padding:6px 10px;display:flex;align-items:center;
  min-height:32px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.pcol .s{border-left:3px solid var(--us)}
.pcol .d{border-left:3px solid var(--jp)}
.pcol .q{color:var(--muted);opacity:.4}

.rel{display:flex;flex-wrap:wrap;gap:7px}
.rel a,.rel span.p{font-size:13px;padding:5px 13px;border:1px solid var(--line);border-radius:999px;
  background:var(--panel2);transition:.12s}
.rel span.p{color:var(--muted)}
.rel a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
/* ---- チャート（系列色は dataviz の検証済みスロット1〜3）---- */
.chart{position:relative;margin-top:6px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin:0 0 10px;font-size:12px;color:var(--muted)}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:11px;height:11px;border-radius:3px}
.grid{stroke:var(--line);stroke-width:1}
text.axis{fill:var(--muted);font-size:11px}
text.dlabel{fill:var(--ink);font-size:12.5px;font-weight:700}
.hit{fill:transparent;cursor:default}
.chart .tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);
  border-radius:10px;box-shadow:var(--shadow);padding:8px 12px;font-size:12px;line-height:1.65;z-index:5}
.chart .tip b{display:block;font-size:13px;margin-bottom:3px}
.chart .tip span{display:block;color:var(--muted);font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabbtn{font-family:inherit;font-size:14px;font-weight:600;padding:8px 18px;border-radius:999px;
  border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:.12s}
.tabbtn:hover{color:var(--ink);border-color:var(--accent)}
.tabbtn.on{background:var(--accent);border-color:var(--accent);color:var(--on-bright)}
.note{font-size:12px;color:var(--muted);line-height:1.8;padding:0 4px}
.dim{opacity:.62;font-size:.88em}
.gwin{color:var(--gold-ink);font-size:12px}
.crowns{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.cr{font-size:10.5px;padding:2px 8px;border-radius:999px;font-weight:700;
  background:var(--eu);color:var(--on-bright);letter-spacing:.02em}
.tag.c{background:var(--eu);color:var(--on-bright)}
.cr.u,.tag.c.u{background:linear-gradient(120deg,var(--jp),var(--eu));
  color:var(--on-bright);box-shadow:0 2px 8px rgba(0,0,0,.22)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);
  padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.chk input{accent-color:var(--accent);margin:0}

/* ---- 入力 ---- */
.inmsg{margin-top:12px;font-size:13px;font-weight:700;text-align:center;min-height:18px;white-space:pre-wrap}
.inmsg.ok{color:var(--accent)}
.inmsg.ng{color:var(--jp)}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.inrow>.inf{flex:1;min-width:92px}
.inf label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;margin-bottom:3px}
.inf label span{font-weight:400;opacity:.75}
.inf input,.inf select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);font-size:14px;font-family:inherit}
.inf input:focus,.inf select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.inbtn{font-family:inherit;font-size:14px;font-weight:700;padding:9px 18px;border-radius:10px;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-bright);cursor:pointer}
.inbtn.sub{background:var(--panel);color:var(--muted);border-color:var(--line)}
.inbtn:disabled{opacity:.45;cursor:default}
.cartitem{display:flex;align-items:center;gap:10px;background:var(--panel2);border-radius:10px;
  padding:9px 12px;margin-bottom:6px;font-size:13px}
.cartitem .sub2{display:block;color:var(--muted);font-size:11.5px}
.cartitem button{margin-left:auto;border:none;background:transparent;color:var(--jp);
  font-weight:800;cursor:pointer;font-size:17px;padding:0 6px;line-height:1}
.rcard{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.rcard .rh{font-weight:800;font-size:14.5px}
.rcard .rs{color:var(--muted);font-size:11.5px;margin-bottom:10px}
.hbox{border-top:1px dashed var(--line);padding-top:9px;margin-top:9px}
.hbox .hn{font-weight:700;margin-bottom:6px}
.hbox .hn em{font-style:normal;font-weight:400;color:var(--muted);font-size:11.5px}
.pzhint{font-size:11.5px;color:var(--accent);font-weight:700;margin-top:4px;min-height:14px}

/* ---- 名馬列伝 ---- */
.leg-hd{display:flex;align-items:center;gap:14px}
.leg-no{flex:0 0 44px;height:44px;border-radius:12px;background:var(--accent-soft);
  color:var(--accent);font-weight:800;font-size:17px;display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums}
.leg-name{font-size:20px;font-weight:800;line-height:1.3}
.leg-name a{color:inherit;text-decoration:none}
.leg-name a:hover{color:var(--accent)}
.leg-meta{font-size:12px;color:var(--muted)}
.leg-body{margin:14px 0 0;font-size:14px;line-height:1.95;text-align:justify}
.leg-wins{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.leg-wins span{font-size:11.5px;padding:3px 9px;border-radius:8px;
  background:var(--gold-soft);color:var(--gold-ink)}
.leg-wins b{font-variant-numeric:tabular-nums;margin-right:4px;opacity:.75}

/* ---- 地図 ---- */
.maplay{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1000px){ .maplay.side{grid-template-columns:minmax(0,1.15fr) minmax(300px,.85fr)} }
.mapfig{position:relative}
svg.map{display:block;width:100%;height:auto;border-radius:12px;background:var(--sea)}
.map .land{fill:var(--land);stroke:var(--landline);stroke-width:.6;stroke-linejoin:round}
.map .pin{fill:var(--muted);opacity:.7}
.map .lead{stroke:var(--muted);stroke-width:.9;opacity:.45}
.map .bar{cursor:pointer}
.map .bar:hover .seg{filter:brightness(1.18)}
.map .halo{fill:none;stroke:var(--ink);stroke-width:1.6;opacity:0}
.map .bar:hover .halo{opacity:.75}
.map .blabel{text-anchor:middle;font-weight:700;fill:var(--ink);
  paint-order:stroke;stroke:var(--sea);stroke-width:3.2px;stroke-linejoin:round}
.mapinfo{position:absolute;left:12px;top:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);font-size:12.5px;
  max-width:60%;pointer-events:none}
.mapinfo b{font-size:14px;display:block;margin-bottom:2px}
.mapinfo span{color:var(--muted);font-variant-numeric:tabular-nums}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:12.5px;color:var(--muted)}
.maplegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;
  vertical-align:-1px}
.mapempty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

/* ---- 一覧 ---- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filters select,.filters input{padding:7px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--panel);color:var(--ink);font-size:13.5px;font-family:inherit}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.hcard{background:var(--panel);border-radius:13px;padding:13px 15px;display:block;
  box-shadow:0 1px 2px rgba(16,60,40,.05);transition:transform .12s,box-shadow .12s}
.hcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.hcard .n{font-weight:700;font-size:15px}
.hcard .m{font-size:11.5px;color:var(--muted);margin-top:2px}
.hcard .r{font-size:11.5px;color:var(--gold-ink);margin-top:4px;font-variant-numeric:tabular-nums}
.loading{text-align:center;padding:70px 20px;color:var(--muted)}
.spin{width:28px;height:28px;border:3px solid var(--accent-soft);border-top-color:var(--accent);
  border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---- 主な実績 ---- */
.card.ach{border:1px solid var(--gold)}
.ach-crowns{display:flex;flex-wrap:wrap;gap:8px}
.crown-big{display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:700;
  padding:7px 9px 7px 15px;border-radius:999px;color:var(--on-bright);
  background:linear-gradient(120deg,var(--gold),#e0ae35);box-shadow:0 2px 10px rgba(192,138,8,.3)}
.crown-big b{font-size:12.5px;background:rgba(0,0,0,.16);padding:1px 9px;border-radius:999px}
.crown-big.u{background:linear-gradient(120deg,#b23a30,var(--eu));box-shadow:0 2px 10px rgba(122,75,198,.32)}
.ach-awards{display:flex;flex-wrap:wrap;gap:7px}
.aw-pill{font-size:13px;padding:5px 13px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel2);transition:.12s}
.aw-pill:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.aw-pill.best{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink);font-weight:700}

/* ---- 「年度表彰とは」 ---- */
.about{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);margin:0 0 22px;overflow:hidden}
.about>summary{padding:12px 18px;cursor:pointer;font-size:14px;font-weight:700;
  color:var(--accent);list-style:none}
.about>summary::-webkit-details-marker{display:none}
.about>summary::before{content:"▸ ";font-size:11px}
.about[open]>summary::before{content:"▾ "}
.about>summary:hover{background:var(--panel2)}
.about-body{padding:2px 18px 16px;font-size:13.5px;border-top:1px solid var(--line)}
.about-body h4{margin:15px 0 6px;font-size:12px;letter-spacing:.08em;color:var(--accent)}
.about-body p{margin:12px 0 0}
.about-body ul{margin:0;padding-left:1.3em}
.about-body li{margin:4px 0}

/* ---- PC表示は少しだけ大きく ---- */
@media(min-width:641px){
  body{font-size:15.5px}
  h1{font-size:27px} .sub{font-size:13.5px}
  .brand{font-size:16.5px} nav a{font-size:14.5px} .status{font-size:12.5px}
  .search input{width:210px;font-size:14.5px} .sug a{font-size:14.5px}

<script>
'use strict';
/* ============ 設定 ============ */
const SHEET_ID = '11lAW1NIhmA8n7Lxch20USaVKQOpNlmnLx7IutnsJ6sM';
const SHEETS = [
  { key:'active',    gid:0 },
  { key:'retired',   gid:1637103436 },
  { key:'broodmare', gid:482152832, tq:'select * where B is not null' },
  { key:'stallion',  gid:495363124, tq:'select * where B is not null' },
  { key:'results',   gid:1732161958 },
  { key:'form',      gid:1758942740 },
  { key:'jockeyM',   gid:708548464 },    // 騎手マスタ
  { key:'jockeyMO',  gid:776150858 },    // 海外騎手マスタ
  { key:'trainerM',  gid:1019895905 },   // 調教師マスタ
  { key:'trainerMO', gid:2023682065 },   // 海外調教師マスタ
  { key:'raceMaster', gid:769926424 },   // レースマスタ
];
const CACHE_KEY = 'wp-cache-v2';
const PT_G1 = 20000, PT_JPN1 = 10000;      // 複合スコアの加点（1着）
const PT_2ND = 10000, PT_3RD = 4000;       // G1での2着・3着の加点（JpnⅠは半分）
const PT_UNDEFEATED = 20000;               // 無敗での三冠達成への上乗せ
const OVERSEAS_MIN_G1 = 2, OVERSEAS_MIN_PRIZE = 10000;
const SPRINT_MAX = 1400;                   // スプリンター部門の上限（日本ならスプリンターズS・高松宮記念）
const MILE_MAX   = 1600;                   // マイラー部門の上限（下限はSPRINT_MAX+1）
// スプリンター・マイラー部門を設ける地域。国外はマイル路線を使わない年が多いので国内のみ
const HAS_SPRINT_MILE = { '日本':true, 'アメリカ':false, '欧州':false };
// 2歳・3歳限定のG1。この部門は古馬混合の芝G1を勝ったかで判定するため、受賞条件から外す
const AGE_LIMITED = new Set(['阪神ジュベナイルフィリーズ','朝日杯フューチュリティステークス',
                             '桜花賞','NHKマイルカップ']);
const ALIAS = { 'ホーメンテスコ':'ホースメンテスコ', '二ホンピロムーテー':'ニホンピロムーテー' };
const REGION_OF = { '栗東':'日本','美浦':'日本','アメリカ':'アメリカ',
                    'イギリス':'欧州','フランス':'欧州','アイルランド':'欧州' };
const REGIONS = ['日本','アメリカ','欧州'];
const HAS_DIRT = { '日本':true, 'アメリカ':true, '欧州':false };
// 着順別の賞金率（1着賞金に対する割合）。地方交流(JpnⅠ〜Ⅲ)は別レート
const RATE = { n:{2:.40,3:.25,4:.15,5:.10}, j:{2:.35,3:.20,4:.10,5:.05} };
// 地方競馬場。格がG1でも地方交流なので j のレートを使う（例: 東京大賞典は格G1だが大井）
const LOCAL_TRACK = /^(大井|川崎|船橋|浦和|門別|盛岡|水沢|金沢|名古屋|笠松|園田|姫路|高知|佐賀)/;
const rateOf = (grade,place) =>
  (/^JPN/.test(G(grade)) || LOCAL_TRACK.test(String(place||'').trim())) ? RATE.j : RATE.n;
const JP_TRACKS = /^(中山|東京|京都|阪神|中京|新潟|福島|小倉|函館|札幌|大井|川崎|船橋|浦和|門別|盛岡|名古屋|園田|金沢|佐賀)/;
const US_TRACKS = /^(アケダクト|ウッドバイン|オークローンパーク|ガルフストリームパーク|キーンランド|サラトガ|サンタアニタ|チャーチルダウンズ|デルマー|ピムリコ|フェアグラウンズ|ベルモントパーク|モンマスパーク|ロスアラミトス)/;
const venueRegion = p => JP_TRACKS.test(p) ? '日本' : US_TRACKS.test(p) ? 'アメリカ' : '欧州';

/* 三冠・完全制覇のボーナス。レース名だけで判定するので格は問わない。
   career:true はキャリア通算で判定し、達成した年に紐づける。
   pt:0 は実績として表示するだけでスコアには加算しない。 */
const CROWNS = [
  { name:'クラシック三冠',       pt:60000, races:['皐月賞','東京優駿(日本ダービー)','菊花賞'] },
  { name:'牝馬クラシック三冠',   pt:40000, races:['桜花賞','優駿牝馬(オークス)','秋華賞'] },
  { name:'春古馬三冠',           pt:50000, races:['大阪杯','天皇賞(春)','宝塚記念'] },
  { name:'秋古馬三冠',           pt:50000, races:['天皇賞(秋)','ジャパンカップ','有馬記念'] },
  { name:'古馬王道完全制覇',     pt:100000, races:['大阪杯','天皇賞(春)','宝塚記念','天皇賞(秋)','ジャパンカップ','有馬記念'] },
  { name:'米国三冠',             pt:60000, races:['ケンタッキーダービー','プリークネスステークス','ベルモントステークス'] },
  { name:'欧州三冠',             pt:60000, races:['イギリス2000ギニー','イギリスダービー','イギリスセントレジャー'] },
  { name:'トリプルティアラ',     pt:50000, races:['エイコーンステークス','コーチングクラブアメリカンオークス','アラバマステークス'] },
  { name:'米国芝三冠',           pt:40000, races:['ベルモントダービー招待ステークス','サラトガダービー招待ステークス','ジョッキークラブダービー招待ステークス'] },
  { name:'米国芝牝馬三冠',       pt:30000, races:['ベルモントオークス招待ステークス','サラトガオークス招待ステークス','ジョッキークラブオークス'] },
  { name:'香港短距離三冠',       pt:30000, races:['センテナリースプリントカップ','チェアマンズスプリントプライズ','香港スプリント'] },
  { name:'春秋マイルG1制覇',     pt:0, races:['農林水産省賞典安田記念','マイルチャンピオンシップ'] },
  { name:'春秋スプリントG1制覇', pt:0, races:['高松宮記念','スプリンターズステークス'] },
  { name:'天皇賞春秋連覇',       pt:0, races:['天皇賞(春)','天皇賞(秋)'] },
  { name:'春秋グランプリ連覇',   pt:0, races:['宝塚記念','有馬記念'] },
  { name:'牝馬G1完全制覇',       pt:0, career:true,
    races:['阪神ジュベナイルフィリーズ','桜花賞','優駿牝馬(オークス)','秋華賞','エリザベス女王杯','ヴィクトリアマイル'] },
];

/* ============ 取得 ============ */
function parseCSV(text){
  const rows=[]; let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===',') { row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c!=='\r') f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  if(!rows.length) return [];
  const head=rows.shift().map(h=>h.trim());
  return rows.map(r=>{ const o={}; head.forEach((h,i)=>{ if(h) o[h]=(r[i]||'').trim(); }); return o; })
             .filter(o=>Object.values(o).some(v=>v!==''));
}
function sheetURL(s){
  const u=new URL('https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/gviz/tq');
  u.searchParams.set('tqx','out:csv');
  u.searchParams.set('gid',String(s.gid));
  // headers=1 は必須。省略するとgvizがヘッダー行数を推測し、
  // 文字列だけの列が続くシートで先頭の数百行をヘッダーとして1行に連結してしまう
  u.searchParams.set('headers','1');
  if(s.tq) u.searchParams.set('tq',s.tq);
  return u;
}
// 1シートを取得する。失敗時は一度だけ待って再試行する
async function fetchOne(s, tries){
  tries = tries || 2;
  let last;
  for(let i=0;i<tries;i++){
    try{
      const r = await fetch(sheetURL(s));
      if(!r.ok) throw new Error('HTTP '+r.status);
      const t = await r.text();
      if(t.trimStart().startsWith('<')) throw new Error('CSVではなくHTMLが返りました');
      if(!t.trim()) throw new Error('空の応答');
      return t;
    }catch(e){ last=e; await new Promise(f=>setTimeout(f,600)); }
  }
  throw new Error(s.key+': '+last.message);
}
async function fetchAll(){
  const texts = await Promise.all(SHEETS.map(s=>fetchOne(s)));
  const out={}; SHEETS.forEach((s,i)=>out[s.key]=texts[i]); return out;
}
const countLines = t => (t||'').split(String.fromCharCode(10)).length;
// シートにフィルターが掛かっていると、その絞り込み結果だけが返る。
// 前回より極端に行数が減っていたら、一時的な状態とみなして採用しない
function looksTruncated(raw, cachedRaw){
  if(!cachedRaw) return null;
  for(const s of SHEETS){
    const now=countLines(raw[s.key]);
    const before=countLines(cachedRaw[s.key]);
    if(before>20 && now < before*0.6) return s.key+'（'+before+'行→'+now+'行）';
  }
  return null;
}

/* ============ モデル構築 ============ */
const nm = n => ALIAS[n] || n;
let DB = null;

/* --- 騎手名・調教師名マスタ ---
   マスタは「名前(ゲーム内表記)」→「変更後(実在の人名)」の対応表。
   変更後が空ならゲーム内表記のまま表示する（オリジナルの架空キャラ）。
   海外シートはフルネーム登録なので、レース結果側の姓だけの表記とは姓で照合する。 */
const SUR = s => s.trim().split(/\s+/).pop();
const PERSON_ALIAS = { 'ディハサン':'ディサハン' };        // 実データ側の表記ゆれ
const SURNAME_PICK = { 'トスカロ':'セサール トスカロ' };   // 姓が重複するときの指定

function buildPersonMap(dom, ovs){
  const exact=new Map(), sur=new Map();
  for(const r of dom||[]){
    const n=(r['名前']||'').trim(); if(!n) continue;
    exact.set(n,{ to:(r['変更後']||'').split('\n')[0].trim(), en:'', full:n,
                  kana:(r['フリガナ']||'').trim(), span:(r['現役期間']||'').trim() });
  }
  for(const r of ovs||[]){
    const n=(r['名前']||'').trim(); if(!n) continue;
    const v=(r['変更後']||'').split('\n');
    const rec={ to:(v[0]||'').trim(), en:(v[1]||'').trim(), full:n, base:(r['所属']||'').trim() };
    exact.set(n,rec);
    const s=SUR(n);
    sur.set(s, sur.has(s) ? 'DUP' : rec);   // 姓が重複したら曖昧なので使わない
  }
  return { exact, sur };
}
function resolvePerson(name, M){
  const n = PERSON_ALIAS[name] || name;
  let rec = M.exact.get(n);
  if(!rec){
    const pick = SURNAME_PICK[n];
    rec = pick ? M.exact.get(pick) : M.sur.get(n);
    if(rec==='DUP') rec = null;
  }
  return { game:n, disp:(rec&&rec.to)?rec.to:n, rec:rec||null };
}

function build(raw){
  const d={}; for(const s of SHEETS) d[s.key]=parseCSV(raw[s.key]||'');

  const horses=new Map();
  const get=n=>{ const k=nm((n||'').trim()); if(!k) return null;
    if(!horses.has(k)) horses.set(k,{name:k,children:[]}); return horses.get(k); };

  for(const r of d.form){ const h=get(r['馬名']); if(!h) continue;
    h.birth=h.birth||r['生年']; h.color=h.color||r['毛色']; h.sex=h.sex||r['性別'];
    h.sire=h.sire||r['父']; h.dam=h.dam||r['母'];
    h.trainer=h.trainer||r['調教師']; h.base=h.base||r['所属']; }
  for(const r of d.active){ const h=get(r['馬名']); if(!h) continue;
    h.id=r['ID']; h.birth=r['生年']||h.birth; h.color=r['毛色']||h.color; h.sex=r['性別']||h.sex;
    h.sire=r['父']||h.sire; h.dam=r['母']||h.dam;
    h.trainer=r['調教師']||h.trainer; h.base=r['所属']||h.base; h.status='現役'; }
  for(const r of d.retired){ const h=get(r['馬名']); if(!h) continue;
    h.id=r['ID']; h.birth=r['生年']||h.birth; h.sex=r['性別']||h.sex;
    h.sire=r['父']||h.sire; h.dam=r['母']||h.dam;
    h.retireYear=r['現役引退年']; h.status='引退'; }
  for(const r of d.broodmare){ const h=get(r['馬名']); if(!h) continue;
    h.id=r['ID']; h.birth=r['生年']||h.birth; h.sex='牝';
    h.sire=r['父']||h.sire; h.dam=r['母']||h.dam;
    h.retireYear=h.retireYear||r['現役引退年']; h.status='繁殖'; }
  for(const r of d.stallion){ const h=get(r['馬名']); if(!h) continue;
    h.id=r['ID']; h.birth=r['生年']||h.birth; h.sex='牡';
    h.sire=r['父']||h.sire; h.dam=r['母']||h.dam;
    h.retireYear=h.retireYear||r['現役引退年']; h.status='種牡馬'; }
  for(const h of horses.values()) h.region = REGION_OF[h.base] || null;

  // 騎手名・調教師名を実在の人名に置き換える
  const JMAP=buildPersonMap(d.jockeyM, d.jockeyMO);
  const TMAP=buildPersonMap(d.trainerM, d.trainerMO);
  const jockeyMeta=new Map(), trainerMeta=new Map();
  const noteMeta=(map,p)=>{
    if(!map.has(p.disp)) map.set(p.disp,{games:new Set(),rec:null});
    const m=map.get(p.disp); m.games.add(p.game); if(p.rec&&!m.rec) m.rec=p.rec;
  };
  for(const h of horses.values()){
    if(!h.trainer) continue;
    const p=resolvePerson(h.trainer,TMAP);
    h.trainerGame=p.game; h.trainer=p.disp; noteMeta(trainerMeta,p);
  }

  // 産駒
  for(const h of horses.values()){
    for(const p of [h.sire,h.dam]){ const pp=p&&horses.get(nm(p)); if(pp) pp.children.push(h.name); }
  }
  for(const h of horses.values())
    h.children.sort((a,b)=>(horses.get(a).birth||'').localeCompare(horses.get(b).birth||''));

  // 戦績
  const runs=[];
  for(const r of d.results){
    const name=nm((r['馬名']||'').trim()); if(!name) continue;
    const jraw=(r['騎手']||'').trim();
    const jp=jraw?resolvePerson(jraw,JMAP):null;
    if(jp) noteMeta(jockeyMeta,jp);
    runs.push({ name, date:r['年月日'], year:+String(r['年月日']).slice(0,4),
      place:r['場所'], race:r['レース名'], grade:r['G'], surface:r['馬場'], cond:r['状態'],
      dist:+r['距離']||0, pop:r['人気'], rank:+r['着順']||0, time:r['タイム'],
      jockey:jp?jp.disp:'', jockeyGame:jp?jp.game:'', prize:+(r['賞金']||0) });
  }
  runs.sort((a,b)=>a.date.localeCompare(b.date));
  const byHorse=new Map();
  for(const r of runs){ if(!byHorse.has(r.name)) byHorse.set(r.name,[]); byHorse.get(r.name).push(r); }
  for(const [n,rs] of byHorse){ const h=get(n); h.runs=rs; h.total=agg(rs); }

  // レース単位に集約 → 勝ち馬を確定し、着順別賞金率から1着賞金を逆算する
  const races=new Map();
  for(const r of runs){
    const k=r.date+'|'+r.place+'|'+r.race;
    if(!races.has(k)) races.set(k,{date:r.date,year:r.year,place:r.place,race:r.race,
      grade:r.grade,surface:r.surface,dist:r.dist,mine:[]});
    races.get(k).mine.push(r);
  }
  // 第1段階: 勝ち馬を確定し、自厩舎の2〜5着の賞金から1着賞金を逆算する
  for(const R of races.values()){
    const w=R.mine.find(x=>x.rank===1);
    if(w){ R.winner=w.name; R.owned=true; R.winPrize=w.prize; }
    else{
      const m=/[(（]([^)）]+)[)）]\s*$/.exec(R.mine[0].time||'');
      R.winner=m?m[1].trim():null; R.owned=false;
      if(R.winner){
        const rt=rateOf(R.grade,R.place);
        for(const x of R.mine)
          if(x.rank>=2&&x.rank<=5&&x.prize){ R.winPrize=Math.round(x.prize/rt[x.rank]); break; }
      }
    }
    for(const x of R.mine) x.winner=R.winner;
  }
  // 第2段階: 自厩舎が6着以下で賞金0だったレースは、同じレースの他年度から1着賞金を推定する
  const racePrize=new Map();
  for(const R of races.values()){
    if(!R.winPrize) continue;
    if(!racePrize.has(R.race)) racePrize.set(R.race,new Map());
    const m=racePrize.get(R.race);
    if(!m.has(R.winPrize)) m.set(R.winPrize,[]);
    m.get(R.winPrize).push(R.year);
  }
  for(const R of races.values()){
    if(R.winPrize||R.owned||!R.winner) continue;
    const m=racePrize.get(R.race); if(!m) continue;
    let best=null;   // 最頻値を優先し、同数なら年が近いもの
    for(const [p,ys] of m){
      const near=-Math.min(...ys.map(y=>Math.abs(y-R.year)));
      if(!best||ys.length>best.n||(ys.length===best.n&&near>best.near)) best={p,n:ys.length,near};
    }
    if(best){ R.winPrize=best.p; R.estimated=true; }
  }
  // 第3段階: 他厩舎馬の戦績としてまとめる
  const rivals=new Map();   // 「馬名|年」→ その年に判明している他厩舎馬の戦績
  for(const R of races.values()){
    if(R.owned||!R.winner) continue;
    const k=R.winner+'|'+R.year;
    if(!rivals.has(k)) rivals.set(k,{name:R.winner,year:R.year,wins:[],regions:{}});
    const v=rivals.get(k);
    v.wins.push(R);
    const rg=venueRegion(R.place); v.regions[rg]=(v.regions[rg]||0)+1;
  }
  for(const v of rivals.values())
    v.region=Object.entries(v.regions).sort((a,b)=>b[1]-a[1])[0][0];

  // 騎手（レース結果の騎手欄から）
  const jockeys=new Map();
  for(const r of runs){ const k=(r.jockey||'').trim(); if(!k) continue;
    if(!jockeys.has(k)) jockeys.set(k,[]); jockeys.get(k).push(r); }
  // 調教師（馬マスタの調教師欄から。管理馬の全戦績を集計する）
  const trainers=new Map();
  for(const h of horses.values()){ const k=(h.trainer||'').trim(); if(!k) continue;
    if(!trainers.has(k)) trainers.set(k,[]); trainers.get(k).push(h); }

  const years=[...new Set(runs.map(r=>r.year))].filter(Boolean).sort();
  const crowns=computeCrowns(runs);
  const awards=computeAwards(horses,runs,years,rivals,crowns);
  return { horses, runs, byHorse, years, awards, rivals, races, jockeys, trainers,
           jockeyMeta, trainerMeta, crowns, raceMaster:d.raceMaster };
}

const G = g => (g||'').replace(/[.．]/g,'');
const isG1 = g => G(g)==='G1';
const isJpn1 = g => G(g)==='JPNⅠ';
const isGraded = g => /^(G[123]|JPN[ⅠⅡⅢ])$/.test(G(g));
const isG2 = g => /^(G2|JPNⅡ)$/.test(G(g));
const isG3 = g => /^(G3|JPNⅢ)$/.test(G(g));

function agg(rs){
  const a={n:rs.length,w:0,p2:0,p3:0,prize:0,g1:0,jpn1:0,gr:0,plc:0,wins:[]};
  for(const r of rs){
    a.prize+=r.prize;
    if(r.rank===2){ a.p2++; if(isG1(r.grade)) a.plc+=PT_2ND; else if(isJpn1(r.grade)) a.plc+=PT_2ND/2; }
    if(r.rank===3){ a.p3++; if(isG1(r.grade)) a.plc+=PT_3RD; else if(isJpn1(r.grade)) a.plc+=PT_3RD/2; }
    if(r.rank!==1) continue;
    a.w++;
    if(isGraded(r.grade)) a.gr++;
    if(isG1(r.grade)){ a.g1++; a.wins.push(r); }
    else if(isJpn1(r.grade)){ a.jpn1++; a.wins.push(r); }
  }
  return a;
}
// 他厩舎馬: 判明している勝ち鞍だけから戦績を組む（賞金は着順別レートからの逆算値）
function aggWins(list){
  const a={n:list.length,w:list.length,p2:0,p3:0,prize:0,g1:0,jpn1:0,gr:0,wins:[],partial:true};
  for(const R of list){
    a.prize+=R.winPrize||0;
    if(isGraded(R.grade)) a.gr++;
    if(isG1(R.grade)){ a.g1++; a.wins.push(R); }
    else if(isJpn1(R.grade)){ a.jpn1++; a.wins.push(R); }
  }
  return a;
}
const pts = a => a.prize + a.g1*PT_G1 + a.jpn1*PT_JPN1 + (a.plc||0) + (a.bonus||0);
const score = a => [pts(a), a.g1, a.gr, a.w];
const better = (x,y) => { for(let i=0;i<x.length;i++) if(x[i]!==y[i]) return x[i]>y[i]; return false; };
const qualifies = (region,a) => {
  if(a.w===0) return false;
  if(region==='日本') return true;
  if(a.g1>=OVERSEAS_MIN_G1) return true;
  return a.g1>=1 && a.prize>=OVERSEAS_MIN_PRIZE;
};

const AGE_CATS=[
  ['最優秀2歳牡馬',   (h,y)=>y-+h.birth===2 && h.sex==='牡'],
  ['最優秀2歳牝馬',   (h,y)=>y-+h.birth===2 && h.sex==='牝'],
  ['最優秀3歳牡馬',   (h,y)=>y-+h.birth===3 && h.sex==='牡'],
  ['最優秀3歳牝馬',   (h,y)=>y-+h.birth===3 && h.sex==='牝'],
  ['最優秀4歳上牡馬', (h,y)=>y-+h.birth>=4 && h.sex==='牡'],
  ['最優秀4歳上牝馬', (h,y)=>y-+h.birth>=4 && h.sex==='牝'],
];
const hasG1 = a => a.g1 + a.jpn1 >= 1;   // 2歳部門・短距離部門の受賞条件

// 三冠・完全制覇の達成判定。デビューから達成までの全戦に敗戦がなければ「無敗」とする
function computeCrowns(runs){
  const all=new Map();    // 馬名 → 全出走
  const byHY=new Map();   // 「馬名|年」→ レース名 → 勝った日付
  const byH=new Map();    // 馬名 → レース名 → 最初に勝った {year,date}
  for(const r of runs){
    if(!all.has(r.name)) all.set(r.name,[]);
    all.get(r.name).push(r);
    if(r.rank!==1) continue;
    const k=r.name+'|'+r.year;
    if(!byHY.has(k)) byHY.set(k,new Map());
    const my=byHY.get(k);
    if(!my.has(r.race)||my.get(r.race)>r.date) my.set(r.race,r.date);
    if(!byH.has(r.name)) byH.set(r.name,new Map());
    const m=byH.get(r.name);
    if(!m.has(r.race)||m.get(r.race).date>r.date) m.set(r.race,{year:r.year,date:r.date});
  }
  // その日までに2着以下が一度も無ければ無敗
  const undefeatedThrough=(name,date)=>
    !(all.get(name)||[]).some(r=>r.rank>=2 && r.date<=date);

  const byHorseYear=new Map(), byHorse=new Map();
  const push=(map,k,v)=>{ if(!map.has(k)) map.set(k,[]); map.get(k).push(v); };
  const record=(name,year,c,lastDate)=>{
    const u = c.pt>0 && undefeatedThrough(name,lastDate);   // 加点のある称号のみ無敗を評価
    const e = { c, year, undefeated:u };
    push(byHorseYear,name+'|'+year,e); push(byHorse,name,e);
  };
  for(const c of CROWNS){
    if(c.career){
      for(const [h,m] of byH){
        if(!c.races.every(x=>m.has(x))) continue;
        const legs=c.races.map(x=>m.get(x));
        const last=legs.reduce((a,b)=>a.date>b.date?a:b);
        record(h,last.year,c,last.date);
      }
    }else{
      for(const [k,m] of byHY){
        if(!c.races.every(x=>m.has(x))) continue;
        const i=k.lastIndexOf('|');
        const lastDate=c.races.map(x=>m.get(x)).sort().pop();
        record(k.slice(0,i),+k.slice(i+1),c,lastDate);
      }
    }
  }
  for(const v of byHorse.values()) v.sort((a,b)=>a.year-b.year||b.c.pt-a.c.pt);
  return { byHorseYear, byHorse };
}
const crownPt = e => e.c.pt + (e.undefeated ? PT_UNDEFEATED : 0);
const crownName = e => (e.undefeated ? '無敗の' : '') + e.c.name;

function computeAwards(horses,runs,years,rivals,crowns){
  const bonusOf=(n,y)=>(crowns.byHorseYear.get(n+'|'+y)||[]).reduce((s,e)=>s+crownPt(e),0);
  const byYear=new Map(), byHorseAward=new Map();
  const note=(e,y,region,cat)=>{
    if(e.rival) return;                    // 他厩舎馬はカルテを持たないので受賞歴を記録しない
    if(!byHorseAward.has(e.n)) byHorseAward.set(e.n,[]);
    byHorseAward.get(e.n).push({year:y,region,cat});
  };
  for(const y of years){
    const rs=runs.filter(r=>r.year===y);
    const names=[...new Set(rs.map(r=>r.name))];
    const yearRivals=[...rivals.values()].filter(v=>v.year===y);
    const regs={};
    for(const region of REGIONS){
      const rn=names.filter(n=>horses.get(n)&&horses.get(n).region===region);
      const rv=yearRivals.filter(v=>v.region===region);
      const list=[];
      const pick=cands=>{ let b=null;
        for(const c of cands) if(qualifies(region,c.a)&&(!b||better(score(c.a),score(b.a)))) b=c;
        return b; };
      const mine=f=>rn.map(n=>{
        const a=agg(rs.filter(r=>r.name===n&&(!f||f(r))));
        if(!f) a.bonus=bonusOf(n,y);      // 三冠ボーナスは通年成績にのみ加算する
        return {n,h:horses.get(n),a};
      }).filter(e=>e.a.n>0);

      // 最優秀馬 — 所有馬のみが候補。G1(またはJpnⅠ)勝ちが必須
      const champ=pick(mine().filter(e=>hasG1(e.a)));
      list.push({cat:'最優秀馬',win:champ});
      if(champ) note(champ,y,region,'最優秀馬');

      // 世代別 — 生年・性別が要るので自厩舎のみ。2歳部門はG1勝ちが必須
      const ent=mine();
      for(const [label,f] of AGE_CATS){
        const b=pick(ent.filter(e=>e.h.birth&&f(e.h,y)&&hasG1(e.a)));
        list.push({cat:label,win:b});
        if(b) note(b,y,region,label);
      }

      // スプリンター・マイラー — 国内のみ。3歳以上で、古馬混合の芝G1を勝っていることが条件。
      // 集計も芝の該当距離帯に絞る（スプリンターズS・高松宮記念／安田記念・マイルCS・ヴィクトリアマイル）
      if(HAS_SPRINT_MILE[region])
        for(const [label,lo,hi] of [['最優秀スプリンター',0,SPRINT_MAX],
                                    ['最優秀マイラー',SPRINT_MAX,MILE_MAX]]){
          const f=r=>r.surface==='芝'&&r.dist>lo&&r.dist<=hi;
          const b=pick(mine(f).filter(e=>
            e.h.birth && y-+e.h.birth>=3 &&
            e.a.wins.some(w=>!AGE_LIMITED.has(w.race))));
          list.push({cat:label,win:b});
          if(b) note(b,y,region,label);
        }

      // ダート
      if(HAS_DIRT[region]){
        const df=r=>r.surface==='ダート';
        const dt=pick(mine(df).filter(e=>hasG1(e.a)));
        list.push({cat:'最優秀ダートホース',win:dt,mergeJpn:true});
        if(dt) note(dt,y,region,'最優秀ダートホース');
      }
      regs[region]={count:rn.length,list,
        rivals:rv.filter(v=>aggWins(v.wins).g1+aggWins(v.wins).jpn1>0)
                 .map(v=>({name:v.name,a:aggWins(v.wins)}))
                 .sort((a,b)=>pts(b.a)-pts(a.a))};
    }
    byYear.set(y,{starters:names.length,runs:rs.length,regs});
  }
  return {byYear,byHorse:byHorseAward};
}

function progenyStats(h){
  const kids=(h.children||[]).map(n=>DB.horses.get(n)).filter(Boolean);
  const ran=kids.filter(k=>k.runs&&k.runs.length);
  const a=ran.map(k=>k.total);
  return { n:kids.length, ran:ran.length, kids,
    w:  a.filter(x=>x.w>0).length,
    gr: a.filter(x=>x.gr>0).length,
    g1: a.filter(x=>x.g1+x.jpn1>0).length,
    prize: a.reduce((s,x)=>s+x.prize,0) };
}
const gradeTag = g => { const t=G(g); if(!t) return '';
  const cls = (t==='G1'||t==='JPNⅠ') ? 'gr g1' : 'gr';
  return /^(G[123]|JPN[ⅠⅡⅢ]|L|OP)$/.test(t) ? '<span class="'+cls+'">'+esc(g)+'</span>' : esc(g); };

      +crowns.map(e=>'<span class="crown-big'+(e.undefeated?' u':'')+'">'
        +esc(crownName(e))+'<b>'+e.year+'</b></span>').join('')+'</div>';
    if(aw.length) s+='<div class="lbl" style="margin-top:'+(crowns.length?'14px':'0')+'">年度表彰</div>'
      +'<div class="ach-awards">'
      +aw.map(a=>'<a class="aw-pill'+(a.cat==='最優秀馬'?' best':'')+'" href="#/awards">'
        +a.year+' <span class="dim">'+esc(a.region)+'</span> '+esc(a.cat)+'</a>').join('')
      +'</div>';
    s+='</div>';
  }

  if(runs.length){
    s+='<div class="card"><h2>通算成績</h2><div class="stats">'
      +st(t.n,'出走')+st(t.w,'勝')+st(t.p2,'2着')+st(t.p3,'3着')
      +st(t.g1+t.jpn1,'G1勝')+st(t.gr,'重賞勝')
      +st(num(t.prize),'獲得賞金')+st((t.n?Math.round(t.w/t.n*100):0)+'%','勝率')
      +'</div></div>';
  }

  // 3代血統表（列ごとに 2頭 / 4頭 / 8頭）
  const p=ancestors(h.name,3);
  if(p.s||p.d){
    const g=(x,k)=>x&&x[k]?x[k]:null;
    const cell=(x,c)=>'<div class="'+c+(x&&x.known?'':' q')+'">'+(x&&x.name?hlink(x.name):'—')+'</div>';
    const c1=[[p.s,'s'],[p.d,'d']];
    const c2=[], c3=[];
    for(const [a] of c1){ c2.push([g(a,'s'),'s'],[g(a,'d'),'d']); }
    for(const [b] of c2){ c3.push([g(b,'s'),'s'],[g(b,'d'),'d']); }
    s+='<div class="card"><h2>血統表</h2><div class="ped">'
      +'<div class="pcol">'+c1.map(([x,c])=>cell(x,c)).join('')+'</div>'
      +'<div class="pcol">'+c2.map(([x,c])=>cell(x,c)).join('')+'</div>'
      +'<div class="pcol c3">'+c3.map(([x,c])=>cell(x,c)).join('')+'</div>'
      +'</div></div>';
  }

  // 近親（同じ母から生まれた馬）
  const sibs=[...DB.horses.values()].filter(x=>x.name!==h.name&&h.dam&&x.dam&&nm(x.dam)===nm(h.dam));
  if(sibs.length){
    s+='<div class="card"><h2>近親</h2>'
      +'<div class="lbl">母'+esc(h.dam)+'の仔 '+sibs.length+'頭</div><div class="rel">'
      +sibs.sort((a,b)=>(a.birth||'').localeCompare(b.birth||''))
           .map(x=>'<a href="#/horse/'+encodeURIComponent(x.name)+'">'+esc(x.name)
             +(x.birth?' <span class="dim">'+x.birth+'</span>':'')+'</a>').join('')
      +'</div></div>';
  }

  // 産駒成績（種牡馬・繁殖牝馬、または産駒が登録されている馬）
  const isBreeder = h.status==='種牡馬'||h.status==='繁殖'||h.children.length>0;
  if(isBreeder){
    const p=progenyStats(h);
    s+='<div class="card"><h2>産駒成績</h2>';
    if(!p.n){
      s+='<div class="none">産駒はまだ登録されていません。</div>';
    }else{
      s+='<div class="stats" style="margin-bottom:16px">'
        +st(p.n,'産駒')+st(p.ran,'出走')+st(p.w,'勝ち上がり')
        +st(p.gr,'重賞勝ち馬')+st(p.g1,'G1勝ち馬')+st(num(p.prize),'産駒総賞金')
        +'</div>';
      // 配合相手
      const partner=k=>nm(k.sire||'')===h.name ? k.dam : k.sire;
      const pc=new Map();
      for(const k of p.kids){ const q=partner(k)||'不明'; pc.set(q,(pc.get(q)||0)+1); }
      if(pc.size){
        s+='<div class="lbl">配合相手 '+pc.size+'頭</div><div class="rel" style="margin-bottom:16px">'
          +[...pc.entries()].sort((a,b)=>b[1]-a[1])
            .map(([q,c])=>hlinkPill(q, c>1?'×'+c:'')).join('')+'</div>';
      }
      // 産駒一覧
      const kids=[...p.kids].sort((a,b)=>(a.birth||'').localeCompare(b.birth||''));
      s+='<div class="scroll"><table><thead><tr><th>産駒</th><th class="num">生年</th><th>性</th>'
        +'<th>毛色</th><th>'+(h.sex==='牡'?'母':'父')+'</th><th>状態</th><th>戦績</th>'
        +'<th class="num">獲得賞金</th><th>主な勝ち鞍</th></tr></thead><tbody>';
      for(const k of kids){
        const t=k.total;
        s+='<tr><td><b>'+hlink(k.name)+'</b></td><td class="num">'+esc(k.birth||'')+'</td>'
          +'<td>'+esc(k.sex||'')+'</td><td>'+esc(k.color||'')+'</td>'
          +'<td>'+(partner(k)?hlink(partner(k)):'')+'</td>'
          +'<td>'+esc(k.status||'')+'</td>'
          +'<td>'+(t?t.n+'戦'+t.w+'勝'+(t.g1+t.jpn1?' <span class="gr g1">G1 '+(t.g1+t.jpn1)+'</span>':'')
                    :'<span class="none">未出走</span>')+'</td>'
          +'<td class="num">'+(t&&t.prize?num(t.prize):'')+'</td>'
          +'<td>'+(t&&t.wins.length?'<span class="gwin">'+t.wins.map(w=>esc(w.race)).join('、')+'</span>':'')+'</td>'
          +'</tr>';
      }
      s+='</tbody></table></div>';
    }
    s+='</div>';
  }

  if(runs.length){
    s+='<div class="card"><h2>全戦績 '+runs.length+'走</h2><div class="scroll"><table><thead><tr>'
      +'<th>日付</th><th>場所</th><th>レース名</th><th>格</th><th>馬場</th><th>状態</th><th class="num">距離</th>'
      +'<th class="num">人気</th><th class="num">着順</th><th>タイム</th><th>勝ち馬</th>'
      +'<th>騎手</th><th class="num">賞金</th>'
      +'</tr></thead><tbody>';
    let cy=null;
    for(const r of runs){
      if(r.year!==cy){ cy=r.year; s+='<tr class="ysep"><td colspan="13">'+cy+'年'
        +(h.birth?'（'+(cy-+h.birth)+'歳）':'')+'</td></tr>'; }
      const t=(r.time||'').replace(/[(（][^)）]*[)）]\s*$/,'');
      s+='<tr><td>'+esc(r.date)+'</td><td>'+esc(r.place.replace('競馬場',''))+'</td>'
        +'<td>'+esc(r.race)+'</td><td>'+gradeTag(r.grade)+'</td>'
        +'<td>'+esc(r.surface)+'</td>'
        +'<td'+(r.cond&&r.cond!=='良'?' class="cond"':'')+'>'+esc(r.cond)+'</td>'
        +'<td class="num">'+(r.dist||'')+'</td><td class="num">'+esc(r.pop)+'</td>'
        +'<td class="num'+(r.rank===1?' win':'')+'">'+(r.rank||'')+'</td>'
        +'<td>'+esc(t)+'</td>'
        +'<td>'+(r.rank===1?'<span class="none">—</span>':(r.winner?hlink(r.winner):''))+'</td>'
        +'<td>'+(r.jockey?jlink(r.jockey):'')+'</td>'
        +'<td class="num">'+(r.prize?num(r.prize):'')+'</td></tr>';
    }
    s+='</tbody></table></div></div>';
  } else s+='<div class="card"><div class="none">出走記録はありません。</div></div>';
  return s;

  function f(k,v){ return '<div><span>'+k+'</span>'+(v||'—')+'</div>'; }
  function st(v,k){ return '<div><b>'+v+'</b><span>'+k+'</span></div>'; }
}

/* ============ 画面: 馬一覧 ============ */
let LF={q:'',status:'',region:'',sort:'birth'};
function viewHorses(){
  const all=[...DB.horses.values()];
  const gens=[...new Set(all.map(h=>h.birth).filter(Boolean))].sort();
  let h='<h1>馬一覧</h1><div class="sub">'+all.length+'頭を登録。うち'+DB.byHorse.size+'頭に出走記録があります。</div>'
   +'<div class="filters">'
   +'<input id="lq" placeholder="馬名・父・母で絞り込み" value="'+esc(LF.q)+'">'
   +sel('lstatus',LF.status,'すべての状態',['現役','引退','繁殖','種牡馬'])
   +sel('lregion',LF.region,'すべての地域',REGIONS)
   +sel('lsort',LF.sort,null,[['birth','生年順'],['prize','獲得賞金順'],['g1','G1勝ち数順'],['name','馬名順']])
   +'</div><div class="grid" id="hgrid">'+cards()+'</div>';
  return h;

  function sel(id,val,ph,opts){
    return '<select id="'+id+'">'+(ph?'<option value="">'+ph+'</option>':'')
      +opts.map(o=>{ const [v,l]=Array.isArray(o)?o:[o,o];
        return '<option value="'+esc(v)+'"'+(val===v?' selected':'')+'>'+esc(l)+'</option>'; }).join('')
      +'</select>';
  }
  function cards(){
    let list=all.filter(x=>
      (!LF.status||x.status===LF.status) &&
      (!LF.region||x.region===LF.region) &&
      (!LF.q||[x.name,x.sire,x.dam].some(v=>v&&v.includes(LF.q))));
    const key={ birth:x=>[-(+x.birth||0),x.name], name:x=>[x.name],
                prize:x=>[-(x.total?x.total.prize:0)], g1:x=>[-((x.total?x.total.g1+x.total.jpn1:0))] }[LF.sort];
    list.sort((a,b)=>{ const A=key(a),B=key(b);
      for(let i=0;i<A.length;i++){ if(A[i]<B[i]) return -1; if(A[i]>B[i]) return 1; } return 0; });
    if(!list.length) return '<div class="none">該当する馬がいません。</div>';
    return list.map(x=>'<a class="hcard" href="#/horse/'+encodeURIComponent(x.name)+'">'
      +'<div class="n">'+esc(x.name)+'</div>'
      +'<div class="m">'+[x.birth&&x.birth+'年',x.sex,x.status,x.base].filter(Boolean).map(esc).join(' ・ ')+'</div>'
      +'<div class="m">'+esc(x.sire||'?')+' × '+esc(x.dam||'?')+'</div>'
      +(x.total?'<div class="r">'+recStr(x.total)+'　'+num(x.total.prize)+'</div>':'')
      +'</a>').join('');
  }
}
function bindHorses(){
  const g=document.getElementById('hgrid'); if(!g) return;
  const re=()=>{ document.getElementById('app').innerHTML=viewHorses(); bindHorses();
                 const i=document.getElementById('lq'); if(i){ i.focus(); i.setSelectionRange(i.value.length,i.value.length);} };
  const q=document.getElementById('lq');
  q.oninput=e=>{ LF.q=e.target.value; document.getElementById('hgrid').innerHTML=viewHorses()
    .split('<div class="grid" id="hgrid">')[1].replace(/<\/div>$/,''); };
  document.getElementById('lstatus').onchange=e=>{ LF.status=e.target.value; re(); };
  document.getElementById('lregion').onchange=e=>{ LF.region=e.target.value; re(); };
  document.getElementById('lsort').onchange=e=>{ LF.sort=e.target.value; re(); };
}

/* ============ 画面: 種牡馬成績・繁殖牝馬成績 ============ */
// 母をたどった先頭（牝系の根）
const famRoot = name => {
  let cur=nm(name||''), seen=new Set();
  for(;;){
    const h=DB.horses.get(cur);
    if(!h||!h.dam) return cur;
    const d=nm(h.dam);
    if(seen.has(d)||!DB.horses.has(d)) return d;
    seen.add(d); cur=d;
  }
};

let MF={ q:'', sort:'prize', only:true };
function matingList(){
  const combo=new Map();
  for(const h of DB.horses.values()){
    if(!h.sire||!h.dam) continue;
    const fam=famRoot(h.dam);
    const k=nm(h.sire)+'|'+fam;
    if(!combo.has(k)) combo.set(k,{sire:nm(h.sire),fam,list:[]});
    combo.get(k).list.push(h);
  }
  const all=[...combo.values()].map(c=>{
    const ran=c.list.filter(x=>x.runs&&x.runs.length);
    const a=ran.map(x=>x.total);
    return { sire:c.sire, fam:c.fam, kids:c.list, n:c.list.length, ran:ran.length,
      w:a.filter(x=>x.w>0).length, gr:a.filter(x=>x.gr>0).length,
      g1:a.filter(x=>x.g1+x.jpn1>0).length,
      prize:a.reduce((s,x)=>s+x.prize,0) };
  });
  const multi=all.filter(x=>x.n>1).length;

  let list=all.filter(x=>
    (!MF.only||x.n>1) &&
    (!MF.q||x.sire.includes(MF.q)||x.fam.includes(MF.q)||x.kids.some(k=>k.name.includes(MF.q))));
  const key={ prize:x=>[-x.prize,-x.n], n:x=>[-x.n,-x.prize], g1:x=>[-x.g1,-x.prize],
              sire:x=>[x.sire,x.fam], fam:x=>[x.fam,x.sire] }[MF.sort];
  list.sort((a,b)=>{ const A=key(a),B=key(b);
    for(let i=0;i<A.length;i++){ if(A[i]<B[i]) return -1; if(A[i]>B[i]) return 1; } return 0; });

  let h='<div class="filters"><input id="mq" placeholder="父・牝系・産駒名で絞り込み" value="'+esc(MF.q)+'">'
    +'<select id="msort">'
    +[['prize','産駒賞金順'],['n','産駒数順'],['g1','G1馬の多い順'],['sire','父の名前順'],['fam','牝系の名前順']]
      .map(([v,l])=>'<option value="'+v+'"'+(MF.sort===v?' selected':'')+'>'+l+'</option>').join('')
    +'</select>'
    +'<label class="chk"><input type="checkbox" id="monly"'+(MF.only?' checked':'')+'> 2頭以上の配合のみ</label>'
    +'</div><div class="card"><div class="scroll">';
  if(!list.length) h+='<div class="none">該当する配合がありません。</div>';
  else{
    h+='<table><thead><tr><th>父</th><th>牝系</th><th class="num">産駒</th><th class="num">出走</th>'
      +'<th class="num">勝ち上がり</th><th class="num">重賞馬</th><th class="num">G1馬</th>'
      +'<th class="num">産駒賞金</th><th>産駒</th></tr></thead><tbody>';
    for(const x of list)
      h+='<tr><td><b>'+hlink(x.sire)+'</b></td><td>'+hlink(x.fam)+'</td>'
        +'<td class="num">'+x.n+'</td><td class="num">'+(x.ran||'')+'</td>'
        +'<td class="num'+(x.w?' win':'')+'">'+(x.w||'')+'</td>'
        +'<td class="num">'+(x.gr||'')+'</td>'
        +'<td class="num'+(x.g1?' win':'')+'">'+(x.g1||'')+'</td>'
        +'<td class="num">'+(x.prize?num(x.prize):'')+'</td>'
        +'<td>'+x.kids.sort((a,b)=>(a.birth||'').localeCompare(b.birth||''))
            .map(k=>hlink(k.name)+(k.total&&k.total.g1+k.total.jpn1?'<span class="gwin"> G1</span>':''))
            .join('、')+'</td></tr>';
    h+='</tbody></table>';
  }
  return h+'</div></div>'
    +'<div class="note">父と母の牝系（母をたどった先頭）の組み合わせで集計しています。'
    +'全'+all.length+'通りのうち、2頭以上の産駒がいる配合は'+multi+'通りです。'
    +'牝系の名前をたどれない馬（母が所有馬に登録されていない場合）は、その母の名前を牝系名としています。</div>';
}

let PED={ tab:'stallions' };
const PED_TABS=[['stallions','種牡馬'],['broodmares','繁殖牝馬'],['mating','配合分析']];
function viewPedigree(){
  const body = PED.tab==='mating' ? matingList() : viewBreeding(PED.tab);
  return '<h1>血統</h1><div class="sub">所有する種牡馬・繁殖牝馬の台帳と、父と牝系の組み合わせごとの成績です。</div>'
    +'<div class="tabs">'+PED_TABS.map(([id,l])=>
      '<button class="tabbtn'+(PED.tab===id?' on':'')+'" data-ptab="'+id+'">'+l+'</button>').join('')+'</div>'
    +'<div id="pedbody">'+body+'</div>';
}
function bindPedigree(){
  document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{
    PED.tab=b.dataset.ptab;
    location.hash = PED.tab==='mating' ? '#/mating' : '#/'+PED.tab;
  });
  if(PED.tab==='mating'){
    const redraw=()=>{ document.getElementById('pedbody').innerHTML=matingList(); bindPedigree();
      const i=document.getElementById('mq'); if(i&&MF.q){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } };
    const q=document.getElementById('mq');
    if(q){ q.oninput=e=>{ MF.q=e.target.value; redraw(); };
      document.getElementById('msort').onchange=e=>{ MF.sort=e.target.value; redraw(); };
      document.getElementById('monly').onchange=e=>{ MF.only=e.target.checked; redraw(); }; }
  } else bindBreeding(PED.tab);
}

let BF={ stallions:{q:'',sort:'prize',only:false}, broodmares:{q:'',sort:'prize',only:false} };
function viewBreeding(kind){
  const isS = kind==='stallions';
  const label = isS ? '種牡馬' : '繁殖牝馬';
  const f = BF[kind];
  const all = [...DB.horses.values()].filter(h=>h.status===(isS?'種牡馬':'繁殖'));
  const withKids = all.filter(h=>h.children.length).length;

  let h='<div class="lbl">所有する'+label+' '+all.length+'頭。'
    +'産駒を登録しているのは'+withKids+'頭です。馬名から個別のカルテへ移動できます。</div>'
    +'<div class="filters">'
    +'<input id="bq" placeholder="馬名・父・母で絞り込み" value="'+esc(f.q)+'">'
    +'<select id="bsort">'
    +[['prize','産駒賞金順'],['kids','産駒数順'],['birth','生年順'],['name','馬名順']]
      .map(([v,l])=>'<option value="'+v+'"'+(f.sort===v?' selected':'')+'>'+l+'</option>').join('')
    +'</select>'
    +'<label class="chk"><input type="checkbox" id="bonly"'+(f.only?' checked':'')+'> 産駒がいる馬のみ</label>'
    +'</div><div class="card"><div class="scroll" id="btable">'+table()+'</div></div>'
    +'<div class="note">このデータベースは所有馬のみで構成されています。'
    +'Winning Postでは所有できる'+label+'の頭数に上限があるため、'
    +'繁殖入りしても所有できなかった馬には産駒のデータがありません。</div>';
  return h;

  function table(){
    let list=all.filter(x=>
      (!f.only||x.children.length) &&
      (!f.q||[x.name,x.sire,x.dam].some(v=>v&&v.includes(f.q))));
    const rows=list.map(x=>({x,p:progenyStats(x)}));
    const key={ prize:r=>[-r.p.prize,-r.p.n], kids:r=>[-r.p.n,-r.p.prize],
                birth:r=>[-(+r.x.birth||0),r.x.name], name:r=>[r.x.name] }[f.sort];
    rows.sort((a,b)=>{ const A=key(a),B=key(b);
      for(let i=0;i<A.length;i++){ if(A[i]<B[i]) return -1; if(A[i]>B[i]) return 1; } return 0; });
    if(!rows.length) return '<div class="none">該当する馬がいません。</div>';
    let s='<table><thead><tr><th>馬名</th><th class="num">生年</th><th>父</th><th>母</th><th>母父</th>'
      +'<th>現役成績</th><th class="num">産駒</th><th class="num">出走</th><th class="num">勝馬</th>'
      +'<th class="num">重賞馬</th><th class="num">G1馬</th><th class="num">産駒賞金</th></tr></thead><tbody>';
    for(const {x,p} of rows){
      const t=x.total, bms=bmsOf(x);
      s+='<tr><td><b>'+hlink(x.name)+'</b></td><td class="num">'+esc(x.birth||'')+'</td>'
        +'<td>'+(x.sire?hlink(x.sire):'')+'</td><td>'+(x.dam?hlink(x.dam):'')+'</td>'
        +'<td>'+(bms?hlink(bms):'<span class="none">—</span>')+'</td>'
        +'<td>'+(t?t.n+'戦'+t.w+'勝'+(t.g1+t.jpn1?'<span class="gr g1">G1 '+(t.g1+t.jpn1)+'</span>':'')
                  :'<span class="none">—</span>')+'</td>'
        +'<td class="num">'+(p.n||'')+'</td><td class="num">'+(p.ran||'')+'</td>'
        +'<td class="num'+(p.w?' win':'')+'">'+(p.w||'')+'</td>'
        +'<td class="num">'+(p.gr||'')+'</td>'
        +'<td class="num'+(p.g1?' win':'')+'">'+(p.g1||'')+'</td>'
        +'<td class="num">'+(p.prize?num(p.prize):'')+'</td></tr>';
    }
    return s+'</tbody></table>';
  }
}
function bindBreeding(kind){
  const f=BF[kind];
  const redraw=()=>{ document.getElementById('pedbody').innerHTML=viewBreeding(kind); bindPedigree();
    const i=document.getElementById('bq'); if(i&&document.activeElement!==i&&f.q){ i.focus();
      i.setSelectionRange(i.value.length,i.value.length); } };
  const q=document.getElementById('bq'); if(!q) return;
  q.oninput=e=>{ f.q=e.target.value; redraw(); };
  document.getElementById('bsort').onchange=e=>{ f.sort=e.target.value; redraw(); };

// ゲーム内表記や英語名などの補足行
function personSub(meta, disp){
  if(!meta) return '';
  const bits=[];
  const games=[...meta.games].filter(g=>g&&g!==disp);
  if(games.length) bits.push('ゲーム内表記: '+games.join('、'));
  const r=meta.rec;
  if(r){
    if(r.en) bits.push(r.en);
    if(r.kana) bits.push(r.kana);
    if(r.span) bits.push('現役 '+r.span);
    if(r.base) bits.push(r.base);
  }
  return bits.length ? '<div class="sub" style="margin:4px 0 0">'+esc(bits.join(' ／ '))+'</div>' : '';
}
const matchPerson = (meta,q) => !q || [...(meta?meta.games:[])].some(g=>g.includes(q));
const tile = (v,k) => '<div><b>'+v+'</b><span>'+k+'</span></div>';
// 年度別成績の表
function yearTable(runsList){

    +'<th class="num">勝</th><th class="num">重賞</th><th class="num">G1</th><th class="num">賞金</th>'
    +'</tr></thead><tbody>';
  for(const y of ys){ const a=agg(runsList.filter(r=>r.year===y));
    s+='<tr><td class="num">'+y+'</td><td class="num">'+a.n+'</td>'
      +'<td class="num'+(a.w?' win':'')+'">'+a.w+'</td><td class="num">'+(a.gr||'')+'</td>'
      +'<td class="num'+(a.g1+a.jpn1?' win':'')+'">'+((a.g1+a.jpn1)||'')+'</td>'

function bindPeople(kind){

function viewVenue(place){
  const rs=DB.runs.filter(r=>r.place===place);
  if(!rs.length) return '<h1>該当なし</h1><div class="sub">「'+esc(place)+'」の出走記録はありません。</div>';
  const a=agg(rs);
  const ci=COURSE_INFO[place];
  let s='<div class="card"><div class="hero-h"><div class="name">'+esc(shortPlace(place))+'</div>'
    +'<div class="tags"><span class="tag">'+esc(venueRegion(place))+'</span>'
    +(ci?'<span class="tag">'+esc(ci[0])+'</span>':'')+'</div></div>'
    +(ci?'<div class="note" style="margin-top:10px">コース形態 … '+esc(ci[1])
        +'<span class="dim">（実在の競馬場の作りです。シートには無い情報なので、'
        +'ゲーム内の設定と違う場合があります）</span></div>':'')
    +'<div class="stats" style="margin-top:16px">'
    +tile(a.n,'出走')+tile(a.w,'1着')+tile(a.p2,'2着')+tile(a.p3,'3着')
    +tile(rate(a),'勝率')+tile(rate2(a),'連対率')+tile(a.g1+a.jpn1,'G1勝')+tile(num(a.prize),'獲得賞金')
    +'</div></div>';

  // 馬場別・距離別・馬場状態別
  s+='<div class="card"><h2>馬場別</h2>'
    +recTable([['芝',agg(rs.filter(r=>r.surface==='芝'))],['ダート',agg(rs.filter(r=>r.surface==='ダート'))]],'馬場')
    +'</div>';
  s+='<div class="card"><h2>距離別</h2>'
    +recTable(DIST_BANDS.map(([l,f])=>[l,agg(rs.filter(r=>r.dist&&f(r.dist)))]),'距離')+'</div>';
  s+='<div class="card"><h2>馬場状態別</h2>'
    +recTable(CONDS.map(c=>[c,agg(rs.filter(r=>r.cond===c))]),'状態')+'</div>';

  // 勝利騎手・勝利調教師
  const rank=(keyFn,label,linkFn)=>{
    const m=new Map();
    for(const r of rs){ const k=keyFn(r); if(!k) continue;
      if(!m.has(k)) m.set(k,[]); m.get(k).push(r); }
    const list=[...m.entries()].map(([k,l])=>({k,a:agg(l)}))
      .filter(x=>x.a.w>0).sort((x,y)=>y.a.w-x.a.w||y.a.prize-x.a.prize);
    if(!list.length) return '<div class="none">勝利がありません。</div>';
    let t='<div class="scroll"><table><thead><tr><th>'+label+'</th><th class="num">騎乗</th>'
      +'<th class="num">1着</th><th class="num">勝率</th><th class="num">重賞</th>'
      +'<th class="num">G1</th><th class="num">獲得賞金</th></tr></thead><tbody>';
    for(const x of list)
      t+='<tr><td><b>'+linkFn(x.k)+'</b></td><td class="num">'+x.a.n+'</td>'
        +'<td class="num win">'+x.a.w+'</td><td class="num">'+rate(x.a)+'</td>'
        +'<td class="num">'+(x.a.gr||'')+'</td>'
        +'<td class="num'+(x.a.g1+x.a.jpn1?' win':'')+'">'+((x.a.g1+x.a.jpn1)||'')+'</td>'
        +'<td class="num">'+num(x.a.prize)+'</td></tr>';
    return t+'</tbody></table></div>';
  };
  s+='<div class="card"><h2>勝利騎手</h2>'+rank(r=>r.jockey,'騎手',jlink)+'</div>';
  s+='<div class="card"><h2>勝利調教師</h2>'+rank(r=>trainerOf(r.name),'調教師',tlink)+'</div>';

  // この競馬場での重賞勝ち鞍
  const big=rs.filter(r=>r.rank===1&&isGraded(r.grade)).sort((x,y)=>y.date.localeCompare(x.date));
  s+='<div class="card"><h2>重賞勝ち鞍 '+big.length+'勝</h2>';
  if(!big.length) s+='<div class="none">重賞勝ちはありません。</div>';
  else{
    s+='<div class="scroll"><table><thead><tr><th>日付</th><th>レース名</th><th>格</th>'
      +'<th>馬名</th><th>騎手</th><th class="num">賞金</th></tr></thead><tbody>';
    for(const r of big)
      s+='<tr><td>'+esc(r.date)+'</td><td><b>'+raceLink(r.race)+'</b></td><td>'+gradeTag(r.grade)+'</td>'
        +'<td>'+hlink(r.name)+'</td><td>'+(r.jockey?jlink(r.jockey):'')+'</td>'
        +'<td class="num">'+num(r.prize)+'</td></tr>';
    s+='</tbody></table></div>';
  }
  return s+'</div>';
}

const raceLink = n => '<a class="link" href="#/race/'+encodeURIComponent(n)+'">'+esc(n)+'</a>';

function raceList(){
  // レースマスタの重賞＋実際に出走した重賞
  const info=new Map();
  for(const r of DB.raceMaster||[]) if(isGraded(r['G']))
    info.set(r['レース名'],{grade:r['G'],place:r['場所'],dist:+r['距離']||0,surface:r['馬場'],month:r['月']});
  for(const r of DB.runs) if(isGraded(r.grade)&&!info.has(r.race))
    info.set(r.race,{grade:r.grade,place:r.place,dist:r.dist,surface:r.surface,month:r.date.split('/')[1]});
  const runsBy=new Map();
  for(const r of DB.runs){ if(!info.has(r.race)) continue;
    if(!runsBy.has(r.race)) runsBy.set(r.race,[]); runsBy.get(r.race).push(r); }

  let list=[...info.entries()].map(([name,i])=>{
    const rs=runsBy.get(name)||[];
    const wins=rs.filter(r=>r.rank===1).sort((a,b)=>a.date.localeCompare(b.date));
    return {name,i,a:agg(rs),wins,region:venueRegion(i.place)};
  });
  if(CF.rq) list=list.filter(x=>x.name.includes(CF.rq)||shortPlace(x.i.place).includes(CF.rq));
  if(CF.rgrade) list=list.filter(x=>G(x.i.grade)===CF.rgrade);
  if(CF.rwon==='won') list=list.filter(x=>x.wins.length);
  if(CF.rwon==='not') list=list.filter(x=>!x.wins.length);
  const key={ name:x=>[x.name], w:x=>[-x.wins.length,-x.a.n], n:x=>[-x.a.n],
              grade:x=>[['G1','JPNⅠ','G2','JPNⅡ','G3','JPNⅢ'].indexOf(G(x.i.grade)),x.name],
              dist:x=>[x.i.dist,x.name] }[CF.rsort];
  list.sort((a,b)=>{ const A=key(a),B=key(b);
    for(let i=0;i<A.length;i++){ if(A[i]<B[i]) return -1; if(A[i]>B[i]) return 1; } return 0; });

  const grades=['G1','JPNⅠ','G2','JPNⅡ','G3','JPNⅢ'];
  let h='<div class="filters"><input id="rq" placeholder="レース名・競馬場で絞り込み" value="'+esc(CF.rq)+'">'
    +'<select id="rgrade"><option value="">すべての格</option>'
    +grades.map(g=>'<option value="'+g+'"'+(CF.rgrade===g?' selected':'')+'>'+g+'</option>').join('')+'</select>'
    +'<select id="rwon"><option value="">勝敗を問わない</option>'
    +'<option value="won"'+(CF.rwon==='won'?' selected':'')+'>勝ったことがある</option>'
    +'<option value="not"'+(CF.rwon==='not'?' selected':'')+'>まだ勝っていない</option></select>'
    +'<select id="rsort">'
    +[['name','名前順'],['grade','格順'],['w','勝利数順'],['n','出走数順'],['dist','距離順']]
      .map(([v,l])=>'<option value="'+v+'"'+(CF.rsort===v?' selected':'')+'>'+l+'</option>').join('')
    +'</select></div>';
  const totalWon=[...info.keys()].filter(n=>(runsBy.get(n)||[]).some(r=>r.rank===1)).length;
  h+='<div class="card"><div class="scroll"><table><thead><tr><th>レース名</th><th>格</th>'
    +'<th>競馬場</th><th class="num">距離</th><th>馬場</th><th class="num">出走</th>'
    +'<th class="num">勝利</th><th>勝ち馬</th></tr></thead><tbody>';
  for(const x of list)
    h+='<tr><td><b>'+raceLink(x.name)+'</b></td><td>'+gradeTag(x.i.grade)+'</td>'
      +'<td>'+esc(shortPlace(x.i.place))+'</td><td class="num">'+(x.i.dist||'')+'</td>'
      +'<td>'+esc(x.i.surface||'')+'</td><td class="num">'+(x.a.n||'')+'</td>'
      +'<td class="num'+(x.wins.length?' win':'')+'">'+(x.wins.length||'')+'</td>'
      +'<td>'+(x.wins.length?x.wins.map(w=>w.date.slice(0,4)+' '+hlink(w.name)).join('、')
              :'<span class="none">—</span>')+'</td></tr>';
  return h+'</tbody></table></div></div>'
    +'<div class="note">重賞'+info.size+'件のうち'+totalWon+'件で勝利があります。'
    +'「まだ勝っていない」で絞り込むと、未制覇の重賞が一覧できます。</div>';
}

function viewRace(name){
  const rs=DB.runs.filter(r=>r.race===name).sort((a,b)=>a.date.localeCompare(b.date));
  const mi=(DB.raceMaster||[]).find(r=>r['レース名']===name);
  if(!rs.length&&!mi) return '<h1>該当なし</h1><div class="sub">「'+esc(name)+'」は登録されていません。</div>';
  const i= mi ? {grade:mi['G'],place:mi['場所'],dist:+mi['距離']||0,surface:mi['馬場'],month:mi['月']}
              : {grade:rs[0].grade,place:rs[0].place,dist:rs[0].dist,surface:rs[0].surface,month:rs[0].date.split('/')[1]};
  const a=agg(rs);
  let s='<div class="card"><div class="hero-h"><div class="name">'+esc(name)+'</div>'
    +'<div class="tags"><span class="tag">'+esc(G(i.grade))+'</span></div></div>'
    +'<div class="facts">'
    +'<div><span>競馬場</span>'+(i.place?'<a class="link" href="#/venue/'+encodeURIComponent(i.place)+'">'+esc(shortPlace(i.place))+'</a>':'—')+'</div>'
    +'<div><span>距離</span>'+(i.dist||'—')+'m</div>'
    +'<div><span>馬場</span>'+esc(i.surface||'—')+'</div>'
    +'<div><span>施行月</span>'+(i.month?i.month+'月':'—')+'</div>'
    +'</div></div>';
  if(rs.length) s+='<div class="card"><h2>自厩舎の成績</h2><div class="stats">'
    +tile(a.n,'出走')+tile(a.w,'1着')+tile(a.p2,'2着')+tile(a.p3,'3着')
    +tile(rate(a),'勝率')+tile(num(a.prize),'獲得賞金')+'</div></div>';

  // 歴代優勝馬（自厩舎＋他厩舎）
  const byYear=new Map();
  for(const R of DB.races.values()) if(R.race===name&&R.winner)
    byYear.set(R.year,{year:R.year,date:R.date,winner:R.winner,owned:R.owned,prize:R.winPrize,est:R.estimated});
  const years=[...byYear.values()].sort((a,b)=>b.year-a.year);
  s+='<div class="card"><h2>歴代優勝馬 '+years.length+'年ぶん</h2>';
  if(!years.length) s+='<div class="none">勝ち馬が判明している年がありません。</div>';
  else{
    s+='<div class="scroll"><table><thead><tr><th class="num">年</th><th>優勝馬</th><th></th>'
      +'<th class="num">1着賞金</th></tr></thead><tbody>';
    for(const y of years)
      s+='<tr><td class="num">'+y.year+'</td><td><b>'+(y.owned?hlink(y.winner):esc(y.winner))+'</b></td>'
        +'<td>'+(y.owned?'':'<span class="ext">他厩舎</span>')+'</td>'
        +'<td class="num">'+(y.prize?num(y.prize)+(y.est?'<span class="dim">（推定）</span>':''):'')+'</td></tr>';
    s+='</tbody></table></div>';
  }
  s+='</div>';

  if(rs.length){
    s+='<div class="card"><h2>自厩舎の出走履歴 '+rs.length+'走</h2><div class="scroll"><table><thead><tr>'
      +'<th>日付</th><th>馬名</th><th>状態</th><th class="num">人気</th><th class="num">着順</th>'
      +'<th>タイム</th><th>騎手</th><th class="num">賞金</th></tr></thead><tbody>';
    for(const r of [...rs].reverse())
      s+='<tr><td>'+esc(r.date)+'</td><td><b>'+hlink(r.name)+'</b></td><td>'+esc(r.cond||'')+'</td>'
        +'<td class="num">'+esc(r.pop)+'</td>'
        +'<td class="num'+(r.rank===1?' win':'')+'">'+(r.rank||'')+'</td>'
        +'<td>'+esc((r.time||'').replace(/[(（][^)）]*[)）]\s*$/,''))+'</td>'
        +'<td>'+(r.jockey?jlink(r.jockey):'')+'</td>'
        +'<td class="num">'+(r.prize?num(r.prize):'')+'</td></tr>';
    s+='</tbody></table></div></div>';
  }
  return s;
}

function bindCourses(){
  document.querySelectorAll('.tabbtn').forEach(b=>b.onclick=()=>{
    CF.tab=b.dataset.tab;
    document.getElementById('app').innerHTML=viewCourses(); bindCourses();
  });
  const redraw=()=>{ document.getElementById('tabbody').innerHTML=CF.tab==='venue'?venueList():raceList(); bindCourses(); };
  const on=(id,fn)=>{ const e=document.getElementById(id); if(e) e[e.tagName==='INPUT'?'oninput':'onchange']=ev=>{ fn(ev.target.value); redraw();
    const i=document.getElementById(id); if(i&&i.tagName==='INPUT'){ i.focus(); i.setSelectionRange(i.value.length,i.value.length); } }; };
  on('vq',v=>CF.vq=v); on('vsort',v=>CF.vsort=v);
  on('rq',v=>CF.rq=v); on('rgrade',v=>CF.rgrade=v); on('rwon',v=>CF.rwon=v); on('rsort',v=>CF.rsort=v);
}

/* ============ 画面: 年史（年度サマリー） ============ */
// 系列色は dataviz の検証済みカテゴリカル配色スロット1〜3。
// 全ペアでCVD ΔE 9.2以上、通常視24.0以上を確認済み。
const SERIES = ['日本','アメリカ','欧州'];

function yearlySeries(){
  const out=[];
  for(const y of DB.years){
    const rs=DB.runs.filter(r=>r.year===y);
    if(!rs.length) continue;
    const a=agg(rs);
    const reg={};
    for(const k of SERIES) reg[k]=0;
    for(const r of rs){ const h=DB.horses.get(r.name);
      const k=h&&h.region; if(k&&reg[k]!==undefined) reg[k]+=r.prize; }
    const champs=SERIES.map(k=>{
      const c=(DB.awards.byYear.get(y).regs[k].list||[]).find(x=>x.cat==='最優秀馬');
      return c&&c.win?{region:k,name:c.win.n}:null; }).filter(Boolean);
    const crowns=[];
    for(const [k,list] of DB.crowns.byHorseYear)
      if(+k.slice(k.lastIndexOf('|')+1)===y)
        for(const e of list) if(e.c.pt>0) crowns.push({horse:k.slice(0,k.lastIndexOf('|')),name:crownName(e)});
    out.push({y, a, reg, champs, crowns, horses:new Set(rs.map(r=>r.name)).size});
  }
  return out;
}

// 棒グラフ（積み上げ対応）。系列が1つなら凡例なし
function barChart(id, data, opts){
  const W=760, H=opts.h||270, L=58, R=16, T=opts.legend?34:14, B=30;
  const iw=W-L-R, ih=H-T-B;
  const band=iw/data.length;
  const bw=Math.min(24, band-10);
  const max=opts.max||Math.max(...data.map(d=>d.total))||1;
  const ticks=opts.ticks;
  const y=v=>T+ih-(v/max)*ih;
  let s='<div class="chart" id="'+id+'">';
  if(opts.legend) s+='<div class="legend">'+opts.keys.map((k,i)=>
      '<span class="lg"><i style="background:var(--s'+(i+1)+')"></i>'+esc(k)+'</span>').join('')+'</div>';
  s+='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria)+'">';
  // 目盛りとグリッド
  for(const t of ticks){
    const yy=y(t);
    s+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+yy+'" y2="'+yy+'"/>'
      +'<text class="axis" x="'+(L-8)+'" y="'+(yy+4)+'" text-anchor="end">'+opts.fmt(t)+'</text>';
  }
  data.forEach((d,i)=>{
    const cx=L+band*i+band/2;
    let acc=0;
    d.vals.forEach((v,j)=>{
      if(v<=0) return;
      const y0=y(acc), y1=y(acc+v);
      const topSeg=!d.vals.slice(j+1).some(x=>x>0);
      let h=y0-y1-(acc>0?2:0);       // 積み上げの境目に2pxの余白
      if(h<1) h=1;
      const yy=y1;
      const r=topSeg?4:0;
      s+='<path class="bar" fill="var(--s'+(j+1)+')" d="'
        +'M'+(cx-bw/2)+' '+(yy+h)
        +'V'+(yy+r)+'q0 '+(-r)+' '+r+' '+(-r)
        +'h'+(bw-2*r)+'q'+r+' 0 '+r+' '+r
        +'V'+(yy+h)+'Z"/>';
      acc+=v;
    });
    s+='<text class="axis" x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'
      +(data.length>10&&i%2===1?'':String(d.label).slice(2))+'</text>';
    s+='<rect class="hit" x="'+(L+band*i)+'" y="'+T+'" width="'+band+'" height="'+ih
      +'" data-tip="'+esc(d.tip)+'"/>';
  });
  // 直接ラベルは最終年のみ
  const last=data[data.length-1];
  if(last&&opts.endLabel)
    s+='<text class="dlabel" x="'+(L+band*(data.length-1)+band/2)+'" y="'+(y(last.total)-9)
      +'" text-anchor="middle">'+esc(opts.endLabel(last))+'</text>';
  return s+'</svg><div class="tip" hidden></div></div>';
}

    +barChart('c-prize',prizeData,{legend:true,keys:SERIES,ticks:tp,h:280,
      fmt:v=>v>=1000000?(v/1000000)+'M':v>=1000?(v/1000)+'k':String(v),
      aria:'年度別の獲得賞金を所属地域別に積み上げた棒グラフ',
      endLabel:d=>num(d.total)})+'</div>';

  s+='<div class="card"><h2>G1勝ち数の推移</h2>'
    +'<div class="lbl">JpnⅠを含みます。勝率は下がっても大レースの勝ち星は伸び続けています。</div>'
    +barChart('c-g1',g1Data,{ticks:tg,h:230,fmt:v=>String(v),
      aria:'年度別のG1勝ち数の棒グラフ',endLabel:d=>d.total+'勝'})+'</div>';

  // 世代別（生年）
  const gen=new Map();
  for(const h of DB.horses.values()){ const y=+h.birth; if(!y) continue;
    if(!gen.has(y)) gen.set(y,[]); gen.get(y).push(h); }
  const gy=[...gen.keys()].sort((a,b)=>b-a);
  if(gy.length){
    s+='<div class="card"><h2>世代別の成績</h2>'
      +'<div class="lbl">生年ごとの一族の成績です。デビューが遅い世代はまだ数字が伸びきっていません。</div>'

      +'<th class="num">出走</th><th class="num">勝ち上がり</th><th class="num">重賞馬</th>'
      +'<th class="num">G1馬</th><th class="num">獲得賞金</th><th>この世代の稼ぎ頭</th>'
      +'</tr></thead><tbody>';
    for(const y of gy){
      const l=gen.get(y), ran=l.filter(x=>x.runs&&x.runs.length);
      const a=ran.map(x=>x.total);

        +'<td class="num">'+(a.filter(x=>x.gr>0).length||'')+'</td>'
        +'<td class="num'+(a.filter(x=>x.g1+x.jpn1>0).length?' win':'')+'">'
          +(a.filter(x=>x.g1+x.jpn1>0).length||'')+'</td>'

    +'<th class="num">獲得賞金</th><th>最優秀馬</th><th>その年の勲章</th></tr></thead><tbody>';
  for(const d of [...S].reverse()){
    s+='<tr><td class="num"><b><a class="link" href="#/awards">'+d.y+'</a></b></td>'
      +'<td class="num">'+d.horses+'</td><td class="num">'+d.a.n+'</td>'
      +'<td class="num'+(d.a.w?' win':'')+'">'+d.a.w+'</td><td class="num">'+rate(d.a)+'</td>'
      +'<td class="num">'+(d.a.gr||'')+'</td>'
      +'<td class="num'+(d.a.g1+d.a.jpn1?' win':'')+'">'+((d.a.g1+d.a.jpn1)||'')+'</td>'

      +'<td>'+(d.crowns.length?'<span class="gwin">'+d.crowns.map(c=>esc(c.name)).join('、')+'</span>':'')+'</td></tr>';
  }
  s+='</tbody></table></div></div>';
  return s;
}

function bindSummary(){
  document.querySelectorAll('.chart').forEach(c=>{
    const tip=c.querySelector('.tip');
    c.querySelectorAll('.hit').forEach(r=>{
      r.addEventListener('mouseenter',()=>{
        tip.hidden=false;
        tip.innerHTML=r.dataset.tip.split('\n').map((l,i)=>
          i===0?'<b>'+esc(l)+'</b>':'<span>'+esc(l)+'</span>').join('');
      });
      r.addEventListener('mousemove',e=>{
        const b=c.getBoundingClientRect();
        const x=e.clientX-b.left, y=e.clientY-b.top;
        tip.style.left=Math.min(Math.max(x,8),b.width-tip.offsetWidth-8)+'px';
        tip.style.top=Math.max(y-tip.offsetHeight-14,4)+'px';
      });
      r.addEventListener('mouseleave',()=>{ tip.hidden=true; });
    });
  });
}

function recordsBody(region){
  const horses=[...DB.horses.values()].filter(h=>h.region===region&&h.runs&&h.runs.length);
  const runs=DB.runs.filter(r=>{ const h=DB.horses.get(r.name); return h&&h.region===region; });
  const streak=h=>{ let best=0,cur=0;
    for(const r of h.runs){ if(r.rank===1){ cur++; best=Math.max(best,cur); } else cur=0; } return best; };
  const rec=h=>h.total.n+'戦'+h.total.w+'勝　G1 '+(h.total.g1+h.total.jpn1);
  const top=(f,n)=>[...horses].sort(f).slice(0,n||10);
  const board=(title,rows,unit,note)=>{
    let s='<div class="card"><h2>'+title+'</h2>';
    if(note) s+='<div class="lbl">'+note+'</div>';
    if(!rows.length) s+='<div class="none">該当なし</div>';
    else{
      s+='<div class="scroll"><table><thead><tr><th class="num">順</th><th>馬名</th>'
        +'<th class="num">'+unit+'</th><th>内訳</th></tr></thead><tbody>';
      rows.forEach((r,i)=>{ s+='<tr><td class="num">'+(i+1)+'</td><td><b>'+hlink(r.name)+'</b></td>'
        +'<td class="num'+(i===0?' win':'')+'">'+r.v+'</td><td class="dim">'+r.d+'</td></tr>'; });
      s+='</tbody></table></div>';
    }
    return s+'</div>';
  };
  if(!horses.length) return '<div class="card"><div class="none">'+region+'所属の出走記録がありません。</div></div>';

  let s='<div class="sub" style="margin:-8px 0 16px">'+region+'所属 '+horses.length+'頭・'
    +num(runs.length)+'走が対象です。</div>';

  s+=board('通算獲得賞金', top((a,b)=>b.total.prize-a.total.prize)
      .map(h=>({name:h.name,v:num(h.total.prize),d:rec(h)})),'獲得賞金');
  s+=board('G1勝ち数', top((a,b)=>(b.total.g1+b.total.jpn1)-(a.total.g1+a.total.jpn1)||b.total.prize-a.total.prize)
      .map(h=>({name:h.name,v:(h.total.g1+h.total.jpn1)+'勝',d:rec(h)})),'G1勝ち');
  s+=board('通算勝利数', top((a,b)=>b.total.w-a.total.w||b.total.prize-a.total.prize)
      .map(h=>({name:h.name,v:h.total.w+'勝',d:rec(h)})),'勝利数');
  const qual=horses.filter(h=>h.total.n>=8);
  s+=board('勝率', [...qual].sort((a,b)=>b.total.w/b.total.n-a.total.w/a.total.n).slice(0,10)
      .map(h=>({name:h.name,v:Math.round(h.total.w/h.total.n*100)+'%',d:rec(h)})),'勝率','8戦以上が対象');
  s+=board('連勝記録', [...horses].map(h=>({h,s:streak(h)})).filter(x=>x.s>=2)
      .sort((a,b)=>b.s-a.s).slice(0,10)
      .map(x=>({name:x.h.name,v:x.s+'連勝',d:rec(x.h)})),'連勝');
  s+=board('無敗のまま引退', horses.filter(h=>h.total.n>=5&&h.total.n===h.total.w)
      .sort((a,b)=>b.total.n-a.total.n)
      .map(h=>({name:h.name,v:h.total.n+'戦'+h.total.w+'勝',d:rec(h)})),'成績','5戦以上が対象');

  // 年度別の最高獲得賞金
  const rows=[];
  for(const y of [...DB.years].reverse()){
    const rs=runs.filter(r=>r.year===y);
    if(!rs.length) continue;
    const names=[...new Set(rs.map(r=>r.name))];
    let best=null;
    for(const n of names){ const a=agg(rs.filter(r=>r.name===n));
      if(!best||a.prize>best.a.prize) best={n,a}; }
    if(best) rows.push({y,n:best.n,a:best.a});
  }
  if(rows.length){
    s+='<div class="card"><h2>年度別の最高獲得賞金</h2><div class="scroll"><table><thead><tr>'
      +'<th class="num">年</th><th>馬名</th><th>成績</th><th class="num">獲得賞金</th></tr></thead><tbody>';
    for(const r of rows)
      s+='<tr><td class="num">'+r.y+'</td><td><b>'+hlink(r.n)+'</b></td>'
        +'<td class="dim">'+r.a.n+'戦'+r.a.w+'勝　G1 '+(r.a.g1+r.a.jpn1)+'</td>'
        +'<td class="num">'+num(r.a.prize)+'</td></tr>';
    s+='</tbody></table></div></div>';
  }

  // 騎手・調教師（その地域の所属馬に限定して集計）
  const pboard=(title,map,linkFn,keyLabel,runLabel)=>{
    const list=[...map.entries()].map(([k,l])=>({k,a:agg(l)}))
      .filter(x=>x.a.n>0).sort((a,b)=>b.a.w-a.a.w||b.a.prize-a.a.prize).slice(0,10);
    if(!list.length) return '';
    let t='<div class="card"><h2>'+title+'</h2><div class="scroll"><table><thead><tr>'
      +'<th class="num">順</th><th>'+keyLabel+'</th><th class="num">'+runLabel+'</th><th class="num">1着</th>'
      +'<th class="num">勝率</th><th class="num">G1</th><th class="num">獲得賞金</th></tr></thead><tbody>';
    list.forEach((x,i)=>{ t+='<tr><td class="num">'+(i+1)+'</td><td><b>'+linkFn(x.k)+'</b></td>'
      +'<td class="num">'+x.a.n+'</td><td class="num'+(i===0?' win':'')+'">'+x.a.w+'</td>'
      +'<td class="num">'+rate(x.a)+'</td>'
      +'<td class="num">'+((x.a.g1+x.a.jpn1)||'')+'</td><td class="num">'+num(x.a.prize)+'</td></tr>'; });
    return t+'</tbody></table></div></div>';
  };
  const jm=new Map();
  for(const r of runs){ const k=r.jockey; if(!k) continue;
    if(!jm.has(k)) jm.set(k,[]); jm.get(k).push(r); }
  const tm=new Map();
  for(const h of horses){ const k=h.trainer; if(!k) continue;
    if(!tm.has(k)) tm.set(k,[]); tm.get(k).push(...(h.runs||[])); }
  s+=pboard(region+'での騎手 通算勝利数',jm,jlink,'騎手','騎乗');
  s+=pboard(region+'所属馬の調教師 通算勝利数',tm,tlink,'調教師','出走');
  return s;
}

const API_URL='https://script.google.com/macros/s/AKfycbzsRqPCfgQvq0WLmwSSEfv8VtyKn_gVlBx0i_TauO5mf2cmQWDj4wbgikHslloCEHJYLQ/exec';
const TOKEN_KEY='wp-api-token';
const getToken=()=>{ try{ return localStorage.getItem(TOKEN_KEY)||''; }catch(e){ return ''; } };
const setToken=t=>{ try{ localStorage.setItem(TOKEN_KEY,t); }catch(e){} };

async function api(action,extra){
  const res=await fetch(API_URL,{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(Object.assign({token:getToken(),action:action},extra||{}))});
  if(!res.ok) throw new Error('通信に失敗しました（'+res.status+'）');
  const j=await res.json();
  if(!j.ok) throw new Error(j.error||'原因の分からないエラー');
  return j;
}

function inPrizePreview(ri,hi){
  const R=IN.pending.races[ri], id=ri+'_'+hi;
  const rank=Number(document.getElementById('k_'+id).value);
  const wb=document.getElementById('wbox_'+id);
  if(wb) wb.hidden=(rank===1);
  const hint=document.getElementById('pz_'+id); if(!hint) return;
  const z=document.getElementById('z_'+id).value.trim();
  if(z||!rank||!R.winPrize){ hint.textContent=''; return; }
  const rt=rateOf(R.grade,R.place);
  const v=rank===1?R.winPrize:(rt[rank]===undefined?0:Math.round(R.winPrize*rt[rank]));
  hint.textContent='空欄なら '+num(v)+' が入ります（'+rank+'着）';
}
