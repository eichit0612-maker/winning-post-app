  inBindBody();
}

function inBindBody(){
  const $=id=>document.getElementById(id);
  const on=(id,ev,fn)=>{ const e=$(id); if(e) e.addEventListener(ev,fn); };
  const busy=(el,label,fn)=>{ if(IN.busy) return; IN.busy=true;
    const old=el.textContent; el.textContent=label; el.disabled=true;
    fn().catch(err=>inMsg('⚠️ '+err.message,false))
        .then(()=>{ IN.busy=false; el.textContent=old; el.disabled=false; }); };

  if(IN.tab==='entry'){
    ['year','month','week'].forEach(k=>on('e_'+k,'input',e=>{ IN.meet[k]=e.target.value; }));
    // 入力はそのつど状態へ。描き直しても消えないようにする
    [['e_place','place'],['e_race','raceName'],['e_grade','grade'],['e_dist','dist'],
     ['e_surf','trackType'],['e_cond','trackCond'],['e_win','winPrize']]
      .forEach(([id,k])=>{ const el=$(id); if(el)
        el.addEventListener(el.tagName==='SELECT'?'change':'input',ev=>{ IN.race[k]=ev.target.value; }); });
    on('e_horse','change',ev=>{ IN.horse=ev.target.value; });
    on('e_jockey','input',ev=>{ IN.jockey=ev.target.value; });
    on('e_search','click',e=>{
      const m=IN.meet;
      if(!m.month||!m.week){ inMsg('⚠️ 月と週を入れてください',false); return; }
      busy(e.target,'検索中…',()=>api('searchRaces',{month:m.month,week:m.week}).then(j=>{
        IN.cands=j.data||[];
        inMsg(IN.cands.length?IN.cands.length+'件見つかりました':'マスタに登録がありません。下の欄に手入力してください',
          !!IN.cands.length);
        inRender();
      }));
    });
    on('e_cand','change',e=>{
      const c=IN.cands[e.target.value]; if(!c) return;
      IN.race={place:c.place||'', raceName:c.name||'', raceNo:c.raceNo||'',
        grade:c.grade||'G1', dist:c.dist||'', trackType:c.type||'芝',
        trackCond:IN.race.trackCond, winPrize:c.winPrize||'', known:c.winPrize||0};
      inMsg('レース情報を読み込みました',true);
      inRender();
    });
    on('e_add','click',()=>{
      const r=IN.race, horse=IN.horse;
      if(!horse){ inMsg('⚠️ 馬を選んでください',false); return; }
      if(!r.place.trim()||!r.raceName.trim()){
        inMsg('⚠️ 場所とレース名を入れてください',false); return; }
      if(IN.cart.some(x=>x.horseName===horse&&x.raceName===r.raceName)){
        inMsg('⚠️ その馬はこのレースで既に追加済みです',false); return; }
      IN.cart.push({horseName:horse, jockey:IN.jockey.trim(),
        place:r.place.trim(), raceName:r.raceName.trim(), raceNo:r.raceNo,
        grade:r.grade, dist:r.dist, trackType:r.trackType,
        trackCond:r.trackCond, winPrize:String(r.winPrize).trim()});
      IN.horse=''; IN.jockey='';           // レース情報は残す。次の馬をすぐ足せる
      inMsg(horse+' を追加しました',true);
      inRender();
    });
    document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
      IN.cart.splice(+b.dataset.del,1); inMsg(''); inRender(); });
    on('e_clear','click',()=>{ IN.cart=[]; inMsg('リストを空にしました',true); inRender(); });
    on('e_submit','click',e=>{
      const m=IN.meet;
      if(!m.year||!m.month||!m.week){ inMsg('⚠️ 開催の年・月・週を入れてください',false); return; }
      if(!IN.cart.length) return;
      busy(e.target,'登録中…',()=>api('registerEntries',
        {payload:{year:m.year,month:m.month,week:m.week,entries:IN.cart}}).then(j=>{
          IN.cart=[]; IN.pending=null; inMsg(j.message,true); inRender(); }));
    });
  } else if(IN.tab==='horse'){
    [['h_name','name'],['h_birth','birth'],['h_color','color'],['h_sex','sex'],
     ['h_base','base'],['h_sire','sire'],['h_dam','dam'],['h_trainer','trainer']]
      .forEach(([id,k])=>{ const el=$(id); if(el)
        el.addEventListener(el.tagName==='SELECT'?'change':'input',ev=>{
          IN.nh[k]=ev.target.value;
          if(k==='name'){ IN.nhForce=false; }
        }); });
    // 馬名から手が離れたときだけ、同名の知らせを出し直す
    on('h_name','blur',()=>inRender());
    on('h_clear','click',()=>{
      IN.nh={name:'',birth:IN.nh.birth,color:'鹿毛',sex:'牡',sire:'',dam:'',
             trainer:IN.nh.trainer,base:IN.nh.base};
      IN.nhForce=false; inMsg(''); inRender();
    });
    on('h_save','click',e=>{
      const h=IN.nh;
      if(!h.name.trim()){ inMsg('⚠️ 馬名を入れてください',false); return; }
      if(!h.birth){ inMsg('⚠️ 生年を入れてください',false); return; }
      busy(e.target,'登録中…',()=>api('registerHorse',
        {horse:Object.assign({},h,{force:IN.nhForce})}).then(j=>{
          inMsg(j.data.message,true);
          IN.nh={name:'',birth:h.birth,color:'鹿毛',sex:'牡',sire:'',dam:'',
                 trainer:h.trainer,base:h.base};
          IN.nhForce=false;
          IN.init=null; IN.opts=null;          // 馬と候補の一覧を取り直す
          return api('init').then(r=>{ IN.init=r.data; })
            .then(()=>api('horseOptions')).then(r=>{ IN.opts=r.data; inRender(); });
        }).catch(err=>{
          // 同名があるとGASが断ってくる。もう一度押せば登録できるようにする
          if(/既に登録されています/.test(err.message)) IN.nhForce=true;
          inMsg('⚠️ '+err.message,false); inRender();
          throw err;
        }));
    });
  } else {
    on('r_load','click',e=>busy(e.target,'読み込み中…',()=>api('getPending').then(j=>{
      IN.pending=j.data; inMsg('',true); inRender(); })));
    document.querySelectorAll('[id^="k_"],[id^="z_"]').forEach(el=>{
      const k=el.id.slice(2).split('_');
      el.addEventListener('input',()=>inPrizePreview(+k[0],+k[1])); });
    ((IN.pending&&IN.pending.races)||[]).forEach((R,ri)=>
      R.horses.forEach((H,hi)=>inPrizePreview(ri,hi)));
    on('r_save','click',e=>{
      const items=[]; let bad='';
      IN.pending.races.forEach((R,ri)=>{
        const cond=$('c_'+ri).value;
        R.horses.forEach((H,hi)=>{
          const id=ri+'_'+hi, t=$('t_'+id).value.trim();
          if(t&&!TIME_RE.test(t)) bad=H.name+' のタイム「'+t+'」は 1.34.5 か 58.8 の形で入れてください';
          items.push({row:H.row,name:H.name,cond:cond,
            popularity:$('p_'+id).value.trim(), rank:$('k_'+id).value.trim(), time:t,
            winner:(Number($('k_'+id).value)===1?'':$('w_'+id).value.trim()),
            prize:$('z_'+id).value.trim()});
        });
      });
      if(bad){ inMsg('⚠️ '+bad,false); return; }
      busy(e.target,'保存中…',()=>api('saveResults',{items:items}).then(j=>{
        inMsg(j.message,true);
        return api('getPending').then(p=>{ IN.pending=p.data; inRender(); });
      }));
    });
    on('r_commit','click',e=>{
      if(!confirm('仮登録の内容を「登録済」シートへ移します。よろしいですか。')) return;
      busy(e.target,'本登録中…',()=>api('commit').then(j=>{
        IN.pending=null; inMsg(j.message+'\n最新のデータを読み直しています…',true);
        return reloadData().then(()=>{ inMsg(j.message+'\nサイトに反映しました',true); inRender(); });
      }));
    });
  }
}

/* ============ 画面: 名馬列伝 ============ */
// 所有馬だけが対象。他厩舎の馬は勝ち鞍しか分からないので列伝は書けない。
const LEG={sort:'score',region:''};
const MONTH=d=>+String(d).slice(5,7);
const careerPts=a=>a.prize+a.g1*PT_G1+a.jpn1*PT_JPN1;

// 列伝に載せる馬を選ぶ。G1・JpnⅠを3勝以上していることが条件
const LEGEND_MIN_G1=3;
function legendList(){
  const out=[];
  for(const h of DB.horses.values()){
    const runs=h.runs||[]; if(!runs.length) continue;
    const a=h.total||agg(runs);
    const g1=a.g1+a.jpn1;
    if(g1<LEGEND_MIN_G1) continue;
    const awards=DB.awards.byHorse.get(h.name)||[];
    out.push({h,a,runs,g1,score:careerPts(a),
      crowns:DB.crowns.byHorse.get(h.name)||[],
      awards, best:awards.filter(x=>x.cat==='最優秀馬')});
  }
  out.sort((x,y)=>y.score-x.score);
  return out;
}

// 事実を並べて短い列伝にする。欠けている情報は文ごと落とす
function legendProse(e){
  const {h,a,runs,crowns,awards,best}=e;
  const S=[], sorted=[...runs].sort((p,q)=>p.date.localeCompare(q.date));
  const wins=sorted.filter(r=>r.rank===1);
  const g1w=wins.filter(r=>isG1(r.grade)||isJpn1(r.grade));
  const bms=bmsOf(h);

  S.push((h.birth?h.birth+'年生まれの':'')
    +(h.color?h.color+'の':'')+(h.sex?h.sex+'馬':'競走馬')+'。'
    +(h.sire?'父'+h.sire:'')+(h.dam?'、母'+h.dam:'')
    +(bms?'（母父'+bms+'）':'')+(h.sire||h.dam?'。':''));

  const d0=sorted[0];
  if(d0) S.push(d0.year+'年'+MONTH(d0.date)+'月、'+shortPlace(d0.place)+'の'+d0.race+'でデビュー。'
    +(d0.rank===1?'これを危なげなく勝ち上がった。'
      :d0.rank?d0.rank+'着に敗れたが、ここから駆け上がっていく。':''));

  S.push('通算'+a.n+'戦'+a.w+'勝。'
    +(e.g1?'G1・JpnⅠを'+e.g1+'勝し、':'')+'獲得賞金は'+num(a.prize)+'。'
    +(a.n===a.w&&a.n>=5?'一度も敗れることなくターフを去った。':''));

  // 最大の勝ち鞍は賞金が最も高いG1
  const top=g1w.slice().sort((p,q)=>q.prize-p.prize)[0];
  if(top) S.push('最大の勝ち鞍は'+top.year+'年の'+top.race+'。'
    +(top.pop?top.pop+'番人気で':'')+(top.jockey?top.jockey+'を鞍上に':'')
    +shortPlace(top.place)+'の'+top.dist+'mを制した。');

  // 最長連勝。全勝の馬は前の文と重なるので書かない
  let run=0,bestRun=0;
  for(const r of sorted){ if(r.rank===1){ run++; bestRun=Math.max(bestRun,run); } else run=0; }
  if(bestRun>=4&&a.n!==a.w) S.push('最長'+bestRun+'連勝を記録している。');

  // 同じ称号を複数年で獲っていればまとめる
  const cm=new Map();
  for(const c of crowns.filter(c=>c.c.pt>0)){
    const n=crownName(c); if(!cm.has(n)) cm.set(n,new Set()); cm.get(n).add(c.year); }
  for(const [n,ys] of cm)
    S.push([...ys].sort().join('年と')+'年に'+n+'を成し遂げた。');

  if(best.length){
    const byReg=new Map();
    for(const b of best){ if(!byReg.has(b.region)) byReg.set(b.region,[]); byReg.get(b.region).push(b.year); }
    S.push([...byReg].map(([reg,ys])=>{
      ys.sort((p,q)=>p-q);
      return ys.length>2&&ys[ys.length-1]-ys[0]===ys.length-1
        ? ys[0]+'年から'+ys.length+'年続けて'+reg+'を代表する馬に選ばれた'
        : ys.join('・')+'年の'+reg+'を代表する馬に選ばれた';
    }).join('。')+'。');
  }
  else {
    const other=awards.filter(x=>x.cat!=='最優秀馬');
    if(other.length) S.push(other[0].year+'年の'+other[0].region+'で'+other[0].cat+'に選出。');
  }

  // 立ちはだかった馬。タイム欄の勝ち馬名から拾う
  const foe=new Map();
  for(const r of sorted){ if(r.rank===1||!r.winner||r.winner===h.name) continue;
    foe.set(r.winner,(foe.get(r.winner)||0)+1); }
  const rival=[...foe.entries()].sort((p,q)=>q[1]-p[1])[0];
  if(rival&&rival[1]>=3) S.push(rival[1]+'度先着を許した'+rival[0]+'とは、生涯のライバルだった。');

  const kids=(h.children||[]).map(n=>DB.horses.get(n)).filter(Boolean);
  if(h.status==='種牡馬'||h.status==='繁殖'){
    const star=kids.filter(k=>k.total&&k.total.g1+k.total.jpn1>0)
                   .sort((p,q)=>careerPts(q.total)-careerPts(p.total))[0];
    S.push((h.retireYear&&h.retireYear!=='-'?h.retireYear+'年に現役を退き、':'')
      +(h.status==='種牡馬'?'種牡馬':'繁殖牝馬')+'となった。'
      +(kids.length?'産駒は'+kids.length+'頭。':'')
      +(star?'代表産駒は'+star.name+'。':''));
  } else if(h.retireYear&&h.retireYear!=='-') S.push(h.retireYear+'年に現役を退いた。');

  return S.filter(Boolean);
}

      .concat(e.best.map(b=>b.year+'年 '+b.region+'最優秀馬'));

      +'<div class="leg-no">'+(i+1)+'</div>'
      +'<div><div class="leg-name">'+hlink(h.name)+'</div>'
      +'<div class="leg-meta">'+[h.birth?h.birth+'年生':'',h.sex,h.region,h.trainer?h.trainer+' 厩舎':'']
        .filter(Boolean).join('　')+'</div></div></div>'
      +(titles.length?'<div class="crowns">'+titles.map(t=>'<span class="cr">'+esc(t)+'</span>').join('')+'</div>':'')
      +'<div class="stats" style="margin-top:14px">'
      +tile(a.n+'戦'+a.w+'勝','戦績')+tile(rate(a),'勝率')
      +tile(e.g1,'G1・JpnⅠ')+tile(num(a.prize),'獲得賞金')+'</div>'
      +'<p class="leg-body">'+legendProse(e).map(esc).join('')+'</p>';

// 下絵は自動生成の map-data.js。80KBほどあるので、地図を開いたときだけ読み込む。
const MP={view:'jp',metric:'w',split:'surface'};
const MAP_VIEWS=[['world','世界'],['jp','日本'],['us','アメリカ'],['eu','欧州']];
const MAP_METRICS={
  w:    {label:'勝利数',       of:a=>a.w,          unit:'勝'},
  n:    {label:'出走数',       of:a=>a.n,          unit:'走'},
  prize:{label:'獲得賞金',     of:a=>a.prize,      unit:''},
  g1:   {label:'G1・JpnⅠ勝ち', of:a=>a.g1+a.jpn1,  unit:'勝'},
};
const MAP_SPLITS={
  surface:{label:'内訳: 馬場別', keys:['芝','ダート'],
           colors:['var(--s3)','var(--s2)'],
           of:r=>r.surface==='芝'?'芝':r.surface==='ダート'?'ダート':null},
  grade:  {label:'内訳: 格別',   keys:['G1・JpnⅠ','G2・JpnⅡ','G3・JpnⅢ','その他'],
           colors:['var(--g1)','var(--g2)','var(--g3)','var(--gx)'],
           of:r=>isG1(r.grade)||isJpn1(r.grade)?'G1・JpnⅠ'
               :isG2(r.grade)?'G2・JpnⅡ':isG3(r.grade)?'G3・JpnⅢ':'その他'},
};
const mapFmt=(met,v)=>num(Math.round(v))+met.unit;

// map-data.js を作り直したら必ず上げること。ブラウザが古い下絵を握り続けるのを防ぐ
const MAP_DATA_VER='3';
let mapsPromise=null;
function loadMaps(){
  if(window.WP_MAPS) return Promise.resolve(window.WP_MAPS);
  if(!mapsPromise) mapsPromise=new Promise((ok,ng)=>{
    const s=document.createElement('script');
    s.src='map-data.js?v='+MAP_DATA_VER;
    s.onload=()=>window.WP_MAPS?ok(window.WP_MAPS):ng(new Error('中身が空です'));
    s.onerror=()=>ng(new Error('map-data.js が見つかりません'));
    document.head.appendChild(s);
  });
  return mapsPromise;
}
const mercY=lat=>{ const la=Math.max(-85,Math.min(85,lat))*Math.PI/180;
  return (1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2; };
// 緯度経度を下絵と同じ座標系に落とす関数を、表示範囲から作る
function projector(v){
  const [l0,b0,l1,b1]=v.bbox;
  const x0=(l0+180)/360, y0=mercY(b1), k=v.w/((l1+180)/360-x0);
  return (lat,lon)=>[((lon+180)/360-x0)*k,(mercY(lat)-y0)*k];
}

function viewMap(){
  const t=(id,label)=>'<button class="tabbtn'+(MP.view===id?' on':'')+'" data-mv="'+id+'">'+label+'</button>';
  const sel=(id,cur,opts)=>'<select id="'+id+'">'+opts.map(([v,l])=>
    '<option value="'+v+'"'+(cur===v?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';
  return '<h1>地図</h1><div class="sub">競馬場ごとの成績を地図の上に並べています。'
    +'棒の高さがその競馬場での大きさ、色が内訳です。棒を押すと競馬場のページへ移動します。</div>'
    +'<div class="tabs">'+MAP_VIEWS.map(([i,l])=>t(i,l)).join('')+'</div>'
    +'<div class="filters">'
    +sel('mmetric',MP.metric,Object.entries(MAP_METRICS).map(([k,v])=>[k,v.label]))
    +sel('msplit',MP.split,Object.entries(MAP_SPLITS).map(([k,v])=>[k,v.label]))
    +'</div><div id="mapbody"><div class="card"><div class="mapempty">地図を読み込んでいます…</div></div></div>';
}

// 表示範囲に入る競馬場を集計して、棒の元になる値をそろえる
function mapData(){
  const v=window.WP_MAPS.views[MP.view], VN=window.WP_MAPS.venues;
  const [l0,b0,l1,b1]=v.bbox, pr=projector(v);
  const met=MAP_METRICS[MP.metric], sp=MAP_SPLITS[MP.split];
  const by=new Map();
  for(const r of DB.runs){ if(!r.place) continue;
    if(!by.has(r.place)) by.set(r.place,[]); by.get(r.place).push(r); }
  const items=[], missing=[];
  for(const [place,rs] of by){
    const ll=VN[place];
    if(!ll){ missing.push(place); continue; }
    if(ll[0]<b0||ll[0]>b1||ll[1]<l0||ll[1]>l1) continue;
    const a=agg(rs), total=met.of(a);
    if(!(total>0)) continue;
    const segs=sp.keys.map(k=>met.of(agg(rs.filter(r=>sp.of(r)===k))));
    const [x,y]=pr(ll[0],ll[1]);
    items.push({place,a,total,segs,x,y,bx:x});
  }
  return {v,items,met,sp,missing};
}

// 上だけ角を丸めた棒。下端は必ず基準線に付ける
function segPath(x,yTop,w,h,r){
  const rr=Math.max(0,Math.min(r,w/2,h)), n1=v=>Math.round(v*10)/10;
  return 'M'+n1(x)+' '+n1(yTop+h)+'V'+n1(yTop+rr)+'q0 '+n1(-rr)+' '+n1(rr)+' '+n1(-rr)
    +'h'+n1(w-2*rr)+'q'+n1(rr)+' 0 '+n1(rr)+' '+n1(rr)+'V'+n1(yTop+h)+'Z';
}

function mapSvg(d){
  const {v,items,met,sp}=d, n1=x=>Math.round(x*10)/10;
  // 世界地図は日本に20場が固まるので、柱を細く・間隔を詰める。それでも足りない分は重ねる
  const wide=MP.view==='world';
  const BW=Math.max(7,Math.round(v.w/(wide?95:78))), MAXH=v.h*0.30, GAP=1.6;
  const top=Math.max(...items.map(i=>i.total));
  for(const it of items) it.h=Math.max(3,it.total/top*MAXH);

  // 近すぎる棒は横にずらし、本来の位置へは引き出し線でつなぐ
  const gap=BW*(wide?0.62:1.45);
  items.sort((a,b)=>a.x-b.x||a.y-b.y);
  for(let pass=0;pass<60;pass++){
    let moved=false;
    for(let i=0;i<items.length;i++) for(let j=i+1;j<items.length;j++){
      const A=items[i],B=items[j], dx=B.bx-A.bx;
      if(Math.abs(dx)>=gap) continue;
      if(A.y<B.y-B.h||B.y<A.y-A.h) continue;        // 縦に重ならないなら放置
      const push=(gap-Math.abs(dx))/2+0.05, s=dx<0?-1:1;
      A.bx-=s*push; B.bx+=s*push; moved=true;
    }
    if(!moved) break;
  }
  // 画面からはみ出させない。柱は奥行きのぶん右上へ伸びる
  const loX=BW/2+2, hiX=v.w-BW/2-2;
  for(const it of items) it.bx=Math.max(loX,Math.min(hiX,it.bx));

  // 奥（地図の上）から手前の順に描くと、重なったときに手前が上になる
  let bars='';
  for(const it of [...items].sort((a,b)=>a.y-b.y)){
    const x=it.bx-BW/2;
    let last=it.segs.reduce((m,val,i)=>val>0?i:m,-1);
    const segsIn = last<0 ? [it.total] : it.segs;   // 内訳が取れないときは1本の棒にする
    if(last<0) last=0;
    let cy=it.y, segs='';
    for(let i=0;i<segsIn.length;i++){
      const val=segsIn[i]; if(!(val>0)) continue;
      const sh=val/it.total*it.h, yTop=cy-sh;
      const pad=i===last?0:Math.min(GAP,sh*0.4), hh=Math.max(1,sh-pad);
      segs+= i===last
        ? '<path class="seg" d="'+segPath(x,yTop,BW,hh,3)+'" fill="'+sp.colors[i]+'"/>'
        : '<rect class="seg" x="'+n1(x)+'" y="'+n1(yTop+pad)+'" width="'+BW+'" height="'+n1(hh)+'"'
          +' fill="'+sp.colors[i]+'"/>';
      cy=yTop;
    }
    const breakdown=sp.keys.map((k,i)=>k+' '+mapFmt(met,it.segs[i])).join(' ／ ');
    const sum=it.a.n+'走 '+it.a.w+'勝 勝率'+rate(it.a)+' ／ '+met.label+' '+mapFmt(met,it.total);
    bars+='<a class="bar" href="#/venue/'+encodeURIComponent(it.place)+'"'
      +' data-place="'+esc(shortPlace(it.place))+'"'
      +' data-sum="'+esc(sum)+'" data-bd="'+esc(breakdown)+'">'
      +(Math.abs(it.bx-it.x)>1.5
        ? '<line class="lead" x1="'+n1(it.x)+'" y1="'+n1(it.y)+'" x2="'+n1(it.bx)+'" y2="'+n1(it.y)+'"/>' : '')
      +'<circle class="pin" cx="'+n1(it.x)+'" cy="'+n1(it.y)+'" r="2.1"/>'+segs
      +'<rect class="halo" x="'+n1(x-1.6)+'" y="'+n1(it.y-it.h-1.6)+'" width="'+n1(BW+3.2)
      +'" height="'+n1(it.h+3.2)+'" rx="4"/>'
      +'<title>'+esc(shortPlace(it.place))+' — '+esc(sum)+'</title></a>';
  }

  // 直接ラベルは大きい順に置き、先に置いたものと重なるぶんは諦める
  const fs=Math.round(v.w/55), placed=[];
  let labels='';
  for(const it of [...items].sort((a,b)=>b.total-a.total)){
    if(placed.length>=14) break;
    const name=shortPlace(it.place);
    const bw=name.length*fs*1.02, bx=it.bx-bw/2, by=it.y-it.h-fs*1.35;
    if(by<2) continue;
    if(placed.some(p=>bx<p.x+p.w+2&&p.x<bx+bw+2&&by<p.y+p.h+2&&p.y<by+fs*1.2+2)) continue;
    placed.push({x:bx,y:by,w:bw,h:fs*1.2});
    labels+='<text class="blabel" x="'+n1(it.bx)+'" y="'+n1(it.y-it.h-fs*0.45)+'" font-size="'+fs+'">'
      +esc(name)+'</text>';
  }

  const legend='<div class="maplegend">'+sp.keys.map((k,i)=>
    '<span><i style="background:'+sp.colors[i]+'"></i>'+esc(k)+'</span>').join('')
    +'<span style="margin-left:auto">棒の高さ＝'+esc(met.label)+'</span></div>';

  return '<div class="mapfig"><svg class="map" viewBox="0 0 '+v.w+' '+v.h+'" role="img"'
    +' aria-label="競馬場ごとの'+esc(met.label)+'を示した地図">'
    +'<path class="land" d="'+v.d+'"/><g>'+bars+'</g><g>'+labels+'</g></svg>'
    +'<div class="mapinfo" id="mapinfo"><b>'+esc(MAP_VIEWS.find(x=>x[0]===MP.view)[1])+'</b>'
    +'<span>'+items.length+'競馬場・棒の高さは'+esc(met.label)+'</span></div></div>'+legend;
}

function mapTable(d){
  const {items,met,sp}=d;
  const list=[...items].sort((a,b)=>b.total-a.total);
  let h='<div class="card"><h2>'+esc(met.label)+'の多い順</h2><div class="scroll"><table><thead><tr>'
    +'<th>競馬場</th><th class="num">出走</th><th class="num">1着</th><th class="num">勝率</th>'
    +sp.keys.map(k=>'<th class="num">'+esc(k)+'</th>').join('')
    +'<th class="num">'+esc(met.label)+'</th></tr></thead><tbody>';
  for(const x of list)
    h+='<tr><td><b><a class="link" href="#/venue/'+encodeURIComponent(x.place)+'">'
      +esc(shortPlace(x.place))+'</a></b></td>'
      +'<td class="num">'+x.a.n+'</td><td class="num'+(x.a.w?' win':'')+'">'+(x.a.w||'')+'</td>'
      +'<td class="num">'+rate(x.a)+'</td>'
      +x.segs.map(v=>'<td class="num">'+(v>0?num(Math.round(v)):'')+'</td>').join('')
      +'<td class="num">'+mapFmt(met,x.total)+'</td></tr>';
  return h+'</tbody></table></div></div>';
}

function drawMap(){
  const body=document.getElementById('mapbody');
  if(!body||!window.WP_MAPS) return;
  const d=mapData();
  if(!d.items.length){
    body.innerHTML='<div class="card"><div class="mapempty">'
      +'この範囲に出走記録のある競馬場がありません。</div></div>'; return;
  }
  const side=MP.view==='jp'||MP.view==='eu';
  body.innerHTML='<div class="maplay'+(side?' side':'')+'">'
    +'<div class="card">'+mapSvg(d)+'</div>'+mapTable(d)+'</div>'
    +'<div class="note">'+d.items.length+'競馬場を表示しています。'
    +'近い競馬場の棒は読めるように横へずらしてあり、細い線が本来の位置を指しています。'
    +'選んだ指標が0の競馬場は出ません（勝利数で表示すると未勝利の競馬場が消えます）。'
    +(d.missing.length?'　位置が未登録の競馬場: '+d.missing.map(esc).join('、')
      +'（tools/venues.json に緯度経度を足すと出ます）':'')+'</div>';
  const info=document.getElementById('mapinfo'), def=info.innerHTML;
  document.querySelectorAll('.map .bar').forEach(b=>{
    b.addEventListener('mouseenter',()=>{
      info.innerHTML='<b>'+esc(b.dataset.place)+'</b><span>'+esc(b.dataset.sum)+'</span>'
        +'<span>'+esc(b.dataset.bd)+'</span>'; });
    b.addEventListener('mouseleave',()=>{ info.innerHTML=def; });
  });
}

function bindMap(){
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{
    MP.view=b.dataset.mv;
    document.getElementById('app').innerHTML=viewMap(); bindMap();
  });

  });
}

qi.addEventListener('input',()=>{
  const v=qi.value.trim(); if(!v||!DB){ sg.hidden=true; return; }
  const hit=[...DB.horses.values()].filter(h=>h.name.includes(v)).slice(0,12);
  sg.hidden=!hit.length;
  sg.innerHTML=hit.map(h=>'<a href="#/horse/'+encodeURIComponent(h.name)+'">'+esc(h.name)
    +'<small>'+[h.birth,h.status].filter(Boolean).join(' ')+'</small></a>').join('');
});
sg.addEventListener('click',()=>{ sg.hidden=true; qi.value=''; });
document.addEventListener('click',e=>{ if(!e.target.closest('.search')) sg.hidden=true; });

/* ============ テーマ切替 ============ */
const tb=document.getElementById('themeBtn');
const setTheme=t=>{
  document.documentElement.dataset.theme=t;
  tb.textContent = t==='dark' ? '☾' : '☀';
  tb.title = t==='dark' ? 'ライトモードに切り替え' : 'ダークモードに切り替え';
  try{ localStorage.setItem('wp-theme',t); }catch(e){}
};
setTheme(document.documentElement.dataset.theme||'dark');
tb.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* ============ 起動 ============ */
const stat=document.getElementById('status');
// 書き込みのあとにシートを読み直す。入力ページの本登録から呼ぶ
function reloadData(){
  return fetchAll().then(raw=>{
    const t=JSON.stringify(raw);
    try{ localStorage.setItem(CACHE_KEY,t); }catch(e){}
    DB=build(raw);
    stat.title='';
    stat.textContent='最新（'+new Date().toLocaleTimeString('ja-JP',
      {hour:'2-digit',minute:'2-digit'})+'時点）';
  });
}
(function boot(){
  // セーブ切り替えを試した名残のキャッシュを掃除する
  try{ ['wp-cache-v1','wp-cache-v2:wp11','wp-cache-v2:wp10','wp-save'].forEach(k=>localStorage.removeItem(k)); }catch(e){}
  const cached=localStorage.getItem(CACHE_KEY);
  if(cached){
    try{ DB=build(JSON.parse(cached)); render(); stat.textContent='更新を確認中…'; }
    catch(e){ localStorage.removeItem(CACHE_KEY); }
  }
  fetchAll().then(raw=>{
    const shrunk = looksTruncated(raw, cached?JSON.parse(cached):null);
    if(shrunk){
      // 行数が大きく減っているので、前回のデータを保持する
      stat.textContent='データが大幅に減少';
      stat.title='シートにフィルターが残っていませんか。前回のデータを表示しています: '+shrunk;
      return;
    }
    const t=JSON.stringify(raw);
    if(t!==cached){
      try{ localStorage.setItem(CACHE_KEY,t); }catch(e){}
      DB=build(raw); render();
    }
    stat.title='';
    stat.textContent='最新（'+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+'時点）';
  }).catch(err=>{
    stat.textContent='取得失敗';
    if(!DB) document.getElementById('app').innerHTML=
      '<div class="loading">スプレッドシートを読み込めませんでした。<br><small>'+esc(err.message)+'</small></div>';
  });
})();
</script>
